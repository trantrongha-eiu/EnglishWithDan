<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Links from before the address lost its "#": /app/#/x?y → /app/x?y */
      if (location.hash.indexOf('#/') === 0) history.replaceState(null, '', '/app' + location.hash.slice(1));
    </script>
    <!-- The shared shell builds relative links ("tuition.html"): they mean the site root -->
    <base href="/" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg" />
    <!-- Same shell as the static pages: theme, content guard, visit + PWA -->
    <script src="/js/theme.js"></script>
    <script src="/js/shared/site-guard.js" defer></script>
    <script src="/js/shared/visit-tracker.js" defer></script>
    <script src="/js/shared/pwa-register.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnglishWithDan</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- Reuse existing design system CSS (versioned files served by Render) -->
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/motion.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/mobile.css" />
    <link rel="stylesheet" href="/css/dashboard.css" />
    <link rel="stylesheet" href="/css/class-cards.css" />
    <link rel="stylesheet" href="/css/classroom.css" />
    <link rel="stylesheet" href="/css/dictionary-popup.css" />
    <link rel="stylesheet" href="/css/playful.css" />
    <!-- Shared pronunciation engine (window.WordAudio): Oxford recordings, TTS fallback -->
    <script src="/js/shared/word-audio.js" defer></script>
    <!-- Shared "gõ từng chữ" typing drill (window.WbwDrill) for Listen / Dịch -->
    <script src="/js/shared/wbw-drill.js" defer></script>
  </head>
  <body>
    <!-- Site shell (auth guard, top nav + its reminders, upgrade modal, toasts,
         chat widget, online-time tracker). Must run before the React app. -->
    <script src="/js/bundles/app-shell.js"></script>
    <script src="/js/shared/onboarding-tour.js"></script>
    <script src="/js/learning-popups.js"></script>
    <script src="/js/shared/confirm-dialog.js"></script>
    <script src="/js/shared/dictionary-lookup.js"></script>
    <script src="/js/shared/badge-popup.js"></script>

    <div id="root"></div>

    <!-- Markup js/shared/peer-profile.js drives (leaderboard names) -->
    <div class="modal-overlay hidden" id="modal-peer-profile">
      <div class="modal-box modal-sm">
        <div class="modal-header">
          <h3><i class="fas fa-id-card"></i> Hồ sơ học sinh</h3>
          <button class="modal-close" aria-label="Đóng" onclick="closePeerProfile()">✕</button>
        </div>
        <div class="modal-body" id="peer-profile-body"></div>
      </div>
    </div>
    <div class="modal-overlay hidden" id="modal-peer-chat">
      <div class="modal-box modal-md peer-chat-box">
        <div class="modal-header">
          <h3><i class="fas fa-comment-dots"></i> <span id="peer-chat-name">...</span></h3>
          <button class="modal-close" aria-label="Đóng" onclick="closePeerChat()">✕</button>
        </div>
        <div class="peer-chat-messages" id="peer-chat-messages"></div>
        <div class="peer-chat-input-row">
          <textarea id="peer-chat-input" class="peer-chat-input" placeholder="Nhắn gì đó..." rows="1"
            onkeydown="if(event.key==='Enter' &amp;&amp; !event.shiftKey){event.preventDefault();sendPeerChatMessage();}"></textarea>
          <button id="peer-chat-send-btn" class="btn btn-primary" onclick="sendPeerChatMessage()" aria-label="Gửi"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
    <div class="modal-overlay hidden" id="modal-peer-report">
      <div class="modal-box modal-sm">
        <div class="modal-header">
          <h3 id="peer-report-title">Báo cáo</h3>
          <button class="modal-close" aria-label="Đóng" onclick="closePeerReport()">✕</button>
        </div>
        <div class="modal-body">
          <p style="font-size:13px;color:var(--text2);margin-bottom:10px">Báo cáo sẽ được gửi tới giáo viên để xem xét.</p>
          <textarea id="peer-report-reason" class="peer-chat-input" style="width:100%;min-height:90px" placeholder="Mô tả lý do báo cáo..." maxlength="500"></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="closePeerReport()">Hủy</button>
          <button class="btn btn-danger" onclick="submitPeerReport()"><i class="fas fa-flag"></i> Gửi báo cáo</button>
        </div>
      </div>
    </div>
    <script src="/js/shared/peer-profile.js"></script>
    <!-- ⚔️ Thách đấu (window.Duel): BXH and Cửa hàng lửa -->
    <script src="/js/shared/duel.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
