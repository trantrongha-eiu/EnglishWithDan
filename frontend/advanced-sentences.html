<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Viết câu nâng cao – EnglishWithDan</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="/css/tokens.css?v=307c2602bb"/>
  <link rel="stylesheet" href="/css/components.css?v=d2125349c7"/>
  <link rel="stylesheet" href="/css/mobile.css?v=79efafabbe"/>
  <link rel="stylesheet" href="/css/dictionary-popup.css?v=dd9cf65aa3"/>
  <script src="/js/theme.js?v=81e03964c4"></script>
  <script src="/js/shared/site-guard.js?v=a3c022da4f" defer></script>
  <script src="/js/shared/visit-tracker.js?v=c9376aa47f" defer></script>
  <link rel="stylesheet" href="/css/advanced-sentences.css?v=f2a4efe461">
  <link rel="stylesheet" href="/css/playful.css?v=637bc34694"/>
</head>
<body>
<script src="/js/bundles/app-shell.js?v=c3ca51aefd"></script>
<script src="/js/shared/onboarding-tour.js?v=b078d9ea3f"></script>
<script src="/js/shared/word-audio.js?v=56b3f70500"></script>
<script src="/js/shared/dictionary-lookup.js?v=f9ebb9bf99"></script>
<script src="/js/shared/wbw-drill.js?v=6d5b24b4f9"></script>

<!-- ── Quit modal ── -->
<div class="as-hist-overlay hidden" id="as-quit-overlay" style="z-index:1500">
  <div class="as-hist-modal" style="max-width:380px">
    <div class="as-hist-body" style="text-align:center">
      <div style="font-size:40px;margin-bottom:8px">✏️</div>
      <div style="font-size:16px;font-weight:800;margin-bottom:6px">Dừng luyện tập?</div>
      <div id="as-quit-sub" style="font-size:13px;color:var(--text2,#6b7280);margin-bottom:16px"></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="as-next" id="as-quit-continue" style="margin-top:0"><i class="fas fa-arrow-left"></i> Tiếp tục học</button>
        <button class="as-btn" id="as-quit-save" style="justify-content:center"><i class="fas fa-bookmark"></i> Thoát &amp; lưu tiến độ</button>
        <button class="as-btn" id="as-quit-leave" style="justify-content:center;color:#dc2626;border-color:#fca5a5">Dừng lại (không lưu)</button>
      </div>
    </div>
  </div>
</div>

<div id="app"></div>

<!-- Dictionary lookup (double-click a word) -->
<div id="dict-popup" class="dict-popup hidden">
  <div class="dict-header">
    <span class="dict-word" id="dict-word"></span>
    <span class="dict-phonetic" id="dict-phonetic"></span>
    <button class="dict-speak" onclick="speakDictWord()" title="Nghe phát âm"><i class="fas fa-volume-up"></i></button>
    <button class="dict-close" onclick="closeDictPopup()"><i class="fas fa-times"></i></button>
  </div>
  <div id="dict-body" class="dict-body"></div>
</div>

<div id="dict-vocab-modal" class="dict-vocab-modal hidden">
  <div class="dict-vocab-box">
    <div class="dict-vocab-header">
      <h3>📚 Lưu vào sổ từ vựng</h3>
      <button class="dict-vocab-close" onclick="closeVocabPickerModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="dict-vocab-body">
      <div id="dict-vocab-book-list"></div>
      <div class="rd-vocab-new-section">
        <div class="rd-vocab-new-label">Hoặc tạo sổ mới:</div>
        <div style="display:flex;gap:8px">
          <input id="dict-new-book-name" type="text" placeholder="Tên sổ mới..." maxlength="40"
            class="rd-vocab-input"
            onkeydown="if(event.key==='Enter') createDictBookAndSave()" />
          <button onclick="createDictBookAndSave()" class="rd-vocab-create-btn">+ Tạo &amp; lưu</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/advanced-sentences.js?v=616a7353fa"></script>
</body>
</html>
