<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Học phí – EnglishWithDan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/tokens.css?v=307c2602bb">
  <link rel="stylesheet" href="/css/components.css?v=bb5d514434">
  <link rel="stylesheet" href="/css/mobile.css?v=1319d3b9c8">
  <script src="/js/theme.js?v=81e03964c4"></script>
  <script src="/js/shared/site-guard.js?v=c04e9f321f" defer></script>
  <script src="/js/shared/visit-tracker.js?v=c9376aa47f" defer></script>
  <link rel="stylesheet" href="/css/tuition.css?v=be5fc6b0d5">
  <link rel="stylesheet" href="/css/playful.css?v=ffb392e664"/>
</head>
<body>
  <script src="/js/bundles/app-shell.js?v=1a9f0e19e6"></script>

  <div class="tuition-layout">

    <!-- Fixed payment-deadline policy notice -->
    <div class="policy-note">
      <i class="fas fa-circle-info"></i>
      <span>Học viên vui lòng thanh toán học phí trong tuần đầu tiên (7 ngày) kể từ ngày khai giảng khóa học.</span>
    </div>

    <!-- Debt summary banner -->
    <div class="debt-banner loading" id="debtBanner">
      <div class="debt-icon">💰</div>
      <div class="debt-info">
        <div class="debt-label">Đang tải thông tin học phí...</div>
        <div class="debt-amount" style="font-size:18px; opacity:.5;">–</div>
      </div>
    </div>

    <!-- Unpaid fees -->
    <div id="unpaidSection" style="display:none; margin-bottom:28px;">
      <div class="section-title"><i class="fas fa-exclamation-circle" style="color:#dc2626;"></i> Học phí chưa đóng</div>
      <div id="unpaidList"></div>
    </div>

    <!-- Paid fees (collapsible) -->
    <div id="paidSection" style="display:none;">
      <button class="paid-toggle" onclick="togglePaidSection()">
        <i class="fas fa-chevron-right" id="paidToggleIcon"></i>
        <span id="paidToggleLabel">Xem học phí đã đóng</span>
      </button>
      <div id="paidList" style="display:none;"></div>
    </div>

    <!-- Empty state -->
    <div class="empty-state" id="emptyState" style="display:none;">
      <i class="fas fa-receipt"></i>
      <div style="font-size:16px; font-weight:600; margin-bottom:8px;">Chưa có thông tin học phí</div>
      <div style="font-size:14px;">Liên hệ giáo viên để được cập nhật thông tin học phí.</div>
    </div>

    <!-- Payment info (bank + QR) -->
    <div class="payment-card" id="paymentCard" style="display:none;">
      <h3 style="margin:0 0 20px; font-size:16px; font-weight:700;"><i class="fas fa-university"></i> Thông tin chuyển khoản</h3>
      <div class="payment-layout">
        <div style="flex:1; min-width:220px;">
          <div class="bank-info" id="bankInfoBody"></div>
          <div class="payment-note" id="paymentNoteBody" style="display:none;"></div>
        </div>
        <div class="qr-wrap" id="qrWrap" style="display:none;">
          <img id="qrImg" src="" alt="QR ngân hàng">
          <div class="qr-caption">Quét mã để chuyển khoản</div>
        </div>
      </div>
    </div>

  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/tuition.js?v=fe3606c6f0"></script>
</body>
</html>
