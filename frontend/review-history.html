<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch sử Review – EnglishWithDan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/tokens.css?v=307c2602bb">
  <link rel="stylesheet" href="/css/components.css?v=d2125349c7">
  <link rel="stylesheet" href="/css/mobile.css?v=79efafabbe">
  <link rel="stylesheet" href="/css/dictionary-popup.css?v=dd9cf65aa3">
  <script src="/js/theme.js?v=81e03964c4"></script>
  <script src="/js/shared/site-guard.js?v=a3c022da4f" defer></script>
  <script src="/js/shared/visit-tracker.js?v=c9376aa47f" defer></script>
  <style>
    body { background: var(--bg); padding-top: var(--nav-height); }
    .rh-layout { max-width: 820px; margin: 0 auto; padding: 24px 16px; }
    .rh-title { font-size: 20px; font-weight: 800; color: var(--text); margin-bottom: 4px; }
    .rh-subtitle { font-size: 13px; color: var(--text3, #9ca3af); margin-bottom: 18px; }
    .rh-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .rh-filters select, .rh-filters input { border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; background: var(--surface); color: var(--text); font-family: inherit; }
    .rh-item { margin-bottom: 12px; }
    .rh-item-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; font-size: 12px; color: var(--text3, #9ca3af); }
    .rh-mistake { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; font-size: 13px; }
    .rh-mistake:last-child { margin-bottom: 0; }
    .rh-mistake-q { font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .rh-mistake-row { color: var(--text2, #374151); margin-bottom: 3px; }
    .rh-mistake-note { color: var(--text3, #9ca3af); font-style: italic; margin-top: 4px; }
    .rh-empty { text-align: center; padding: 60px 20px; color: var(--text3, #9ca3af); }
    .rh-pagination { display: flex; justify-content: center; gap: 10px; margin-top: 18px; }

    /* View toggle: My Mistakes | Thi thử Full test */
    .rh-viewtabs { display: flex; gap: 8px; margin-bottom: 16px; }
    .rh-viewtab { border: 1px solid var(--border); background: var(--surface); color: var(--text2, #374151); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .rh-viewtab.active { background: var(--brand, #e53935); color: #fff; border-color: var(--brand, #e53935); }

    /* Full mock test history cards */
    .mt-overall-row { margin: 6px 0 10px; }
    .mt-overall { font-size: 15px; font-weight: 800; color: var(--text); }
    .mt-overall.pending { font-size: 13px; font-weight: 600; color: var(--text3, #9ca3af); }
    .mt-violation { display: inline-block; margin-left: 10px; font-size: 12px; font-weight: 800; color: #b91c1c;
      background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 3px 9px; vertical-align: middle; }
    [data-theme="dark"] .mt-violation { background: rgba(185,28,28,.15); color: #fca5a5; border-color: rgba(185,28,28,.4); }
    .mt-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .mt-chip { font-size: 12px; font-weight: 700; border-radius: 8px; padding: 4px 9px; border: 1px solid var(--border); }
    .mt-chip.done { background: #ecfdf5; color: #065f46; border-color: #a7f3d0; }
    .mt-chip.pending { background: var(--surface); color: var(--text3, #9ca3af); }
    [data-theme="dark"] .mt-chip.done { background: rgba(16,185,129,.12); color: #6ee7b7; border-color: rgba(16,185,129,.35); }
    .mt-links { font-size: 12px; }
    .mt-links a { color: var(--brand, #e53935); text-decoration: none; font-weight: 700; }
    .mt-links a:hover { text-decoration: underline; }
  </style>
  <link rel="stylesheet" href="/css/playful.css?v=637bc34694"/>
</head>
<body>
  <script src="/js/bundles/app-shell.js?v=c3ca51aefd"></script>
  <script src="/js/shared/word-audio.js?v=56b3f70500"></script>
  <script src="/js/shared/dictionary-lookup.js?v=f9ebb9bf99"></script>

  <div class="rh-layout">
    <div class="rh-title">📝 My Mistakes</div>
    <div class="rh-subtitle">Lịch sử các câu sai đã review — dữ liệu tự động xóa sau 3 tháng, giống lịch sử làm bài.</div>

    <div class="rh-viewtabs">
      <button id="rhTabMistakes" class="rh-viewtab active">📝 My Mistakes</button>
      <button id="rhTabMock" class="rh-viewtab">🎯 Thi thử Full test</button>
    </div>

    <div class="rh-filters">
      <select id="rhFilterType">
        <option value="">Tất cả</option>
        <option value="reading">Reading (Full test)</option>
        <option value="reading-practice">Reading (Practice)</option>
        <option value="listening">Listening (Full test)</option>
        <option value="listening-practice">Listening (Practice)</option>
      </select>
      <select id="rhFilterCategory"><option value="">Tất cả nhóm lỗi</option></select>
      <input type="date" id="rhFilterFrom" title="Từ ngày">
      <input type="date" id="rhFilterTo" title="Đến ngày">
    </div>

    <div id="rhList"></div>
    <div class="rh-pagination" id="rhPagination" style="display:none">
      <button class="btn btn-ghost btn-sm" id="rhPrevBtn">← Trước</button>
      <span id="rhPageLabel" style="align-self:center;font-size:13px;color:var(--text2)"></span>
      <button class="btn btn-ghost btn-sm" id="rhNextBtn">Sau →</button>
    </div>

    <div id="mockList" style="display:none"></div>
    <div class="rh-pagination" id="mockPagination" style="display:none">
      <button class="btn btn-ghost btn-sm" id="mockPrevBtn">← Trước</button>
      <span id="mockPageLabel" style="align-self:center;font-size:13px;color:var(--text2)"></span>
      <button class="btn btn-ghost btn-sm" id="mockNextBtn">Sau →</button>
    </div>
  </div>

  <script src="/js/review-history.js?v=98b00de639"></script>

  <!-- ══ Dictionary lookup (double-click a word) ══ -->
  <div id="dict-popup" class="dict-popup hidden">
    <div class="dict-header">
      <span class="dict-word" id="dict-word"></span>
      <span class="dict-phonetic" id="dict-phonetic"></span>
      <button class="dict-speak" onclick="speakDictWord()" title="Nghe phát âm" aria-label="Nghe phát âm"><i class="fas fa-volume-up"></i></button>
      <button class="dict-close" onclick="closeDictPopup()" aria-label="Đóng"><i class="fas fa-times"></i></button>
    </div>
    <div id="dict-body" class="dict-body"></div>
  </div>
  <div id="dict-vocab-modal" class="dict-vocab-modal hidden">
    <div class="dict-vocab-box">
      <div class="dict-vocab-header">
        <h3>📚 Lưu vào sổ từ vựng</h3>
        <button class="dict-vocab-close" onclick="closeVocabPickerModal()" aria-label="Đóng"><i class="fas fa-times"></i></button>
      </div>
      <div class="dict-vocab-body">
        <div id="dict-vocab-book-list"></div>
        <div class="rd-vocab-new-section">
          <div class="rd-vocab-new-label">Hoặc tạo sổ mới:</div>
          <div style="display:flex;gap:8px">
            <input id="dict-new-book-name" type="text" placeholder="Tên sổ mới..." maxlength="40"
              class="rd-vocab-input"
              onkeydown="if(event.key==='Enter') createDictBookAndSave()" />
            <button onclick="createDictBookAndSave()" class="rd-vocab-create-btn">+ Tạo &amp; lưu</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
