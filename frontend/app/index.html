<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    </script>
    <!-- The shared shell builds relative links ("tuition.html"): they mean the site root -->

    <script src="/js/theme.js?v=5269b2b242"></script>

    <script src="/js/shared/visit-tracker.js?v=4b5e3beead" defer></script>
    <script src="/js/shared/pwa-register.js?v=713d4c39e1" defer></script>

    <link rel="stylesheet" href="/css/tokens.css?v=307c2602bb" />
    <link rel="stylesheet" href="/css/motion.css?v=cf232e2585" />
    <link rel="stylesheet" href="/css/components.css?v=bb5d514434" />
    <link rel="stylesheet" href="/css/mobile.css?v=1285106fee" />
    <link rel="stylesheet" href="/css/dashboard.css?v=be3224a702" />
    <link rel="stylesheet" href="/css/class-cards.css?v=119a77e44b" />
    <link rel="stylesheet" href="/css/classroom.css?v=500d7f0238" />
    <link rel="stylesheet" href="/css/dictionary-popup.css?v=dd9cf65aa3" />
    <link rel="stylesheet" href="/css/playful.css?v=bb32f1417b" />
    <!-- Shared pronunciation engine (window.WordAudio): Oxford recordings, TTS fallback -->
    <script src="/js/shared/word-audio.js?v=9fd314228b" defer></script>
    <!-- Shared "gõ từng chữ" typing drill (window.WbwDrill) for Listen / Dịch -->
    <script src="/js/shared/wbw-drill.js?v=c4543d57c2" defer></script>
    <!-- Lenient answer check for the grammar drills (window.AnswerMatch) -->
    <script src="/js/shared/answer-match.js?v=4db89d9862" defer></script>
    <!-- The Writing "viết lại" reminder (window.WritingRewriteReminder) for the writing pages -->
    <script src="/js/shared/review-required-popup.js?v=987d9f0585" defer></script>
    <!-- Task 1 Grammar charts (window.T1Chart) -->
    <script src="/js/shared/t1-chart.js?v=aaf8083ca2" defer></script>
    <!-- Task 2 Templates: the full-template text loader (window.Task2GenericTpl) and model-essay highlights (window.T2Highlight) -->
    <script src="/js/shared/task2-generic-tpl.js?v=80c68d2af9" defer></script>
    <script src="/js/shared/task2-highlight.js?v=17c1a1dfb2" defer></script>
    <!-- Task 2 Luyện đề tuần: no pasting into the essay boxes (window.PasteGuard) -->
    <script src="/js/shared/paste-guard.js?v=6658837054" defer></script>
    <script type="module" crossorigin src="/app/assets/index-OD1cTFS3.js"></script>
    <link rel="modulepreload" crossorigin href="/app/assets/jsx-runtime-DyZJNswf.js">
    <link rel="modulepreload" crossorigin href="/app/assets/api-D1qJwJkE.js">
    <link rel="modulepreload" crossorigin href="/app/assets/shell-CA7-k9og.js">
    <link rel="modulepreload" crossorigin href="/app/assets/searchMatch-Du_A4JEQ.js">
    <link rel="stylesheet" crossorigin href="/app/assets/index-BzqjlFKe.css">
  </head>
  <body>
    <!-- Site shell (auth guard, top nav + its reminders, upgrade modal, toasts,
         chat widget, online-time tracker). Must run before the React app. -->
    <script src="/js/bundles/app-shell.js?v=662d4db698"></script>
    <script src="/js/shared/onboarding-tour.js?v=b4f1c8ae01"></script>
    <script src="/js/learning-popups.js?v=fd5ee1e733"></script>
    <script src="/js/shared/confirm-dialog.js?v=31541eaa53"></script>
    <script src="/js/shared/dictionary-lookup.js?v=31484e24ea"></script>
    <script src="/js/shared/badge-popup.js?v=b1f5e551eb"></script>

    <div id="root"></div>

    <!-- Markup js/shared/peer-profile.js drives (leaderboard names) -->
    <div class="modal-overlay hidden" id="modal-peer-profile">
      <div class="modal-box modal-sm">
        <div class="modal-header">
          <h3><i class="fas fa-id-card"></i> Hồ sơ học sinh</h3>
          <button class="modal-close" aria-label="Đóng" onclick="closePeerProfile()">✕</button>
        </div>
        <div class="modal-body" id="peer-profile-body"></div>
      </div>
    </div>
    <div class="modal-overlay hidden" id="modal-peer-chat">
      <div class="modal-box modal-md peer-chat-box">
        <div class="modal-header">
          <h3><i class="fas fa-comment-dots"></i> <span id="peer-chat-name">...</span></h3>
          <button class="modal-close" aria-label="Đóng" onclick="closePeerChat()">✕</button>
        </div>
        <div class="peer-chat-messages" id="peer-chat-messages"></div>
        <div class="peer-chat-input-row">
          <textarea id="peer-chat-input" class="peer-chat-input" placeholder="Nhắn gì đó..." rows="1"
            onkeydown="if(event.key==='Enter' &amp;&amp; !event.shiftKey){event.preventDefault();sendPeerChatMessage();}"></textarea>
          <button id="peer-chat-send-btn" class="btn btn-primary" onclick="sendPeerChatMessage()" aria-label="Gửi"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>
    <div class="modal-overlay hidden" id="modal-peer-report">
      <div class="modal-box modal-sm">
        <div class="modal-header">
          <h3 id="peer-report-title">Báo cáo</h3>
          <button class="modal-close" aria-label="Đóng" onclick="closePeerReport()">✕</button>
        </div>
        <div class="modal-body">
          <p style="font-size:13px;color:var(--text2);margin-bottom:10px">Báo cáo sẽ được gửi tới giáo viên để xem xét.</p>
          <textarea id="peer-report-reason" class="peer-chat-input" style="width:100%;min-height:90px" placeholder="Mô tả lý do báo cáo..." maxlength="500"></textarea>
        </div>
        <div class="modal-footer">
          <button class="btn btn-ghost" onclick="closePeerReport()">Hủy</button>
          <button class="btn btn-danger" onclick="submitPeerReport()"><i class="fas fa-flag"></i> Gửi báo cáo</button>
        </div>
      </div>
    </div>
    <script src="/js/shared/peer-profile.js?v=a13eda43b1"></script>
    <!-- ⚔️ Thách đấu (window.Duel): BXH and Cửa hàng lửa -->
    <script src="/js/shared/duel.js?v=06943e9ed7"></script>
  </body>
</html>
