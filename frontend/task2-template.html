<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Task 2 Templates – EnglishWithDan</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="/css/tokens.css?v=307c2602bb"/>
  <link rel="stylesheet" href="/css/components.css?v=bb5d514434"/>
  <link rel="stylesheet" href="/css/writing-practice.css?v=f34fe3721d"/>
  <link rel="stylesheet" href="/css/mobile.css?v=1319d3b9c8"/>
  <link rel="stylesheet" href="/css/dictionary-popup.css?v=dd9cf65aa3"/>
  <link rel="stylesheet" href="/css/task2-highlight.css?v=52c45edfc6"/>
  <link rel="stylesheet" href="/css/task2-generic-tpl.css?v=33a70659f7"/>
  <script src="/js/theme.js?v=81e03964c4"></script>
  <script src="/js/shared/site-guard.js?v=c04e9f321f" defer></script>
  <script src="/js/shared/visit-tracker.js?v=c9376aa47f" defer></script>
  <link rel="stylesheet" href="/css/task2-template.css?v=fc58a1c9b7">
  <link rel="stylesheet" href="/css/playful.css?v=ffb392e664"/>
</head>
<body>
<script src="/js/bundles/app-shell.js?v=afe4140c3f"></script>
<script src="/js/shared/onboarding-tour.js?v=63967a156b"></script>
<script src="/js/shared/review-required-popup.js?v=2bc5bcc67a"></script>
<script src="/js/shared/word-audio.js?v=28a7a7408e"></script>
<script src="/js/shared/dictionary-lookup.js?v=76b22cb3a9"></script>
<script src="/js/shared/wbw-drill.js?v=9de4d9a281"></script>
<script src="/js/shared/task2-highlight.js?v=2991d441a8"></script>
<script src="/js/shared/task2-generic-tpl.js?v=6c26dac6da"></script>

<!-- Type switch confirm modal -->
<div class="t2-quit-overlay hidden" id="tpl-switch-overlay">
  <div class="t2-quit-box">
    <div class="t2-quit-top">
      <div class="t2-quit-mascot" data-dan="think">🔀</div>
      <div class="t2-quit-title">Rời bài đang luyện?</div>
      <div class="t2-quit-sub" id="tpl-switch-sub"></div>
    </div>
    <div class="t2-quit-actions">
      <button class="t2-quit-continue" onclick="cancelTypeSwitch()">
        <i class="fas fa-arrow-left"></i> Ở lại làm tiếp
      </button>
      <button class="t2-quit-leave" id="tpl-switch-confirm-btn" onclick="confirmTypeSwitch()">
        <i class="fas fa-exchange-alt"></i> Vẫn rời đi
      </button>
    </div>
  </div>
</div>

<!-- ══ PAGE: hero + type tabs + toolbar + path (Listening/Reading playful look) ══ -->
<div class="tpl-page">

  <section class="tpl-hero" id="tpl-hero">
    <div class="tpl-hero-text">
      <h1 class="tpl-hero-title">Luyện viết <span class="tpl-hero-tag">Task 2 Template</span></h1>
      <p class="tpl-hero-sub" id="tpl-page-sub">Lộ trình 5 bước để thuộc bản template đầy đủ của 7 dạng bài IELTS Task 2.</p>
      <div class="tpl-hero-badges">
        <span class="tpl-hero-badge" id="tpl-main-badge">0 / 7 dạng hoàn thành</span>
        <span class="tpl-hero-badge" id="tpl-mode-badge">🧠 Đã thuộc 0/0 câu</span>
      </div>
    </div>
    <div class="tpl-hero-side">
      <!-- Band 6+ / Band 7+ — same 7 essay types; Band 7+ gets fewer hints. -->
      <div class="t2-level-toggle" id="tpl-level-toggle" role="tablist" aria-label="Trình độ">
        <button class="t2-level-btn active" data-level="band6" onclick="switchTplLevel('band6')" role="tab" aria-selected="true">🌱 Band 6+</button>
        <button class="t2-level-btn" data-level="band7" onclick="switchTplLevel('band7')" role="tab" aria-selected="false">🏆 Band 7+</button>
      </div>
      <div class="tpl-hero-tools">
        <button class="tpl-glass-btn" id="tpl-full-btn" onclick="openTplFullView()" title="Xem toàn bộ template của dạng bài này — đúng các câu bạn luyện trong lộ trình">
          <i class="fas fa-file-lines"></i> Xem đầy đủ
        </button>
        <button class="tpl-glass-btn" onclick="openTplHistory()" title="Xem lịch sử luyện tập">
          <i class="fas fa-history"></i> Lịch sử
        </button>
        <button class="tpl-glass-btn tpl-glass-btn--icon" onclick="copyTplShareUrl()" title="Sao chép link chia sẻ trang này" aria-label="Sao chép link">
          <i class="fas fa-link"></i>
        </button>
      </div>
    </div>
    <div class="lh-mascot" id="tpl-hero-mascot" aria-hidden="true"></div>
  </section>

  <!-- 7 essay types -->
  <nav id="tpl-type-tabs" class="tpl-type-nav" aria-label="Dạng bài"></nav>

  <!-- Toolbar — the practice itself is the 5-step path in #tpl-content-area -->
  <div class="tpl-toolbar" id="tpl-toolbar">
    <button class="t2-tpl-exam-btn-tab" id="tpl-exam-btn" onclick="toggleExamMode()" title="Thi thử: nhớ lại mọi câu từ tiếng Việt, không gợi ý, 30 phút">
      <i class="fas fa-clock"></i> <span id="tpl-exam-label">Thi thử</span>
    </button>
    <div class="tpl-stats" id="tpl-type-status"></div>
    <div class="tpl-xp">
      <span class="tpl-stat tpl-stat--xp"><i class="fas fa-star"></i> <span id="header-xp">0</span> XP</span>
      <span class="tpl-stat tpl-stat--fire">🔥 <span id="header-streak">0</span></span>
    </div>
  </div>

  <!-- Per-type reference guide (recognise / outline / 6+→7+ / useful language / model essay / mistakes) -->
  <div id="tpl-guide-area"></div>

  <!-- Content area -->
  <main class="tpl-content-outer">
    <div id="tpl-content-area"></div>
  </main>

</div><!-- end .tpl-page -->

<!-- Dictionary lookup (double-click a word) -->
<div id="dict-popup" class="dict-popup hidden">
  <div class="dict-header">
    <span class="dict-word" id="dict-word"></span>
    <span class="dict-phonetic" id="dict-phonetic"></span>
    <button class="dict-speak" onclick="speakDictWord()" title="Nghe phát âm"><i class="fas fa-volume-up"></i></button>
    <button class="dict-close" onclick="closeDictPopup()"><i class="fas fa-times"></i></button>
  </div>
  <div id="dict-body" class="dict-body"></div>
</div>

<div id="dict-vocab-modal" class="dict-vocab-modal hidden">
  <div class="dict-vocab-box">
    <div class="dict-vocab-header">
      <h3>📚 Lưu vào sổ từ vựng</h3>
      <button class="dict-vocab-close" onclick="closeVocabPickerModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="dict-vocab-body">
      <div id="dict-vocab-book-list"></div>
      <div class="rd-vocab-new-section">
        <div class="rd-vocab-new-label">Hoặc tạo sổ mới:</div>
        <div style="display:flex;gap:8px">
          <input id="dict-new-book-name" type="text" placeholder="Tên sổ mới..." maxlength="40"
            class="rd-vocab-input"
            onkeydown="if(event.key==='Enter') createDictBookAndSave()" />
          <button onclick="createDictBookAndSave()" class="rd-vocab-create-btn">+ Tạo &amp; lưu</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/task2-generic-templates.js?v=a07e561334"></script>
<script src="/js/task2-template.js?v=82efc85a8d"></script>
</body>
</html>
