  /* The class page now lives in the React app (/app/#/classroom, source:
     student-src/src/pages/Classroom.jsx). Old links keep their class + tab.
     classroom.html?legacy=1 stays on this version as a fallback. */
  (function () {
    var q = new URLSearchParams(location.search);
    if (q.get('legacy') === '1') return;
    var qs = q.toString();
    location.replace('/app/#/classroom' + (qs ? '?' + qs : ''));
  })();
  </script>
