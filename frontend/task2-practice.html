<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IELTS Task 2 Practice – EnglishWithDan</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="/css/tokens.css?v=20260831"/>
  <link rel="stylesheet" href="/css/components.css?v=20260831"/>
  <link rel="stylesheet" href="/writing-practice.css?v=20260903"/>
  <link rel="stylesheet" href="/css/mobile.css?v=20261009tuition"/>
  <link rel="stylesheet" href="/css/dictionary-popup.css?v=20260925"/>
  <script src="/js/theme.js?v=20260831"></script>
  <script src="/js/shared/visit-tracker.js?v=20260831"></script>
  <style>
    /* ── Essay type badge colors ── */
    .et-badge{display:inline-block;border-radius:20px;padding:3px 12px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
    .et-adv{background:#e8f5e9;color:#2e7d32}
    .et-cause{background:#fff3e0;color:#e65100}
    .et-opinion{background:#f3e5f5;color:#6a1b9a}
    .et-discuss{background:#e3f2fd;color:#1565c0}
    .et-posneg{background:#e0f2f1;color:#00695c}
    [data-theme="dark"] .et-adv{background:#14321a;color:#81c995}
    [data-theme="dark"] .et-cause{background:#3a2508;color:#ffb74d}
    [data-theme="dark"] .et-opinion{background:#2e1a3a;color:#ce93d8}
    [data-theme="dark"] .et-discuss{background:#132b45;color:#90caf9}
    [data-theme="dark"] .et-posneg{background:#0a2e2a;color:#4db6ac}

    /* ── Navigation steps ── */
    .t2-nav{display:flex;gap:8px;padding:16px 20px;align-items:center;flex-wrap:wrap}
    .t2-nav-crumb{font-size:13px;color:#9ca3af}
    .t2-nav-crumb span{color:#6366f1;font-weight:700;cursor:pointer}
    .t2-nav-crumb span:hover{text-decoration:underline}

    /* ── "Đang dở" pill (weeks + topics) ── */
    .t2-week-draft-pill{display:inline-flex;align-items:center;gap:3px;background:#f59e0b;color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin-top:5px}

    /* ── Topic list ── */
    .t2-topic-list{display:flex;flex-direction:column;gap:10px;padding:16px 20px}
    .t2-topic-card{background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:12px;padding:14px 16px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:12px}
    .t2-topic-card:hover{border-color:#6366f1;background:#f0f0ff}
    .t2-topic-emoji{font-size:28px}
    .t2-topic-name{font-weight:700;font-size:15px;color:#111827;margin-bottom:4px}
    .t2-topic-prompt{font-size:12px;color:#6b7280;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    [data-theme="dark"] .t2-topic-card{background:var(--surface, #0d0d0d);border-color:var(--border2, #333333)}
    [data-theme="dark"] .t2-topic-name{color:#f1f5f9}

    /* ── Topic hub: prompt + draft banner ── */
    .t2-selector-prompt{font-size:13px;color:#4b5563;background:#f0f9ff;border:1px solid #bae6fd;border-radius:10px;padding:10px 14px;margin:12px 0;line-height:1.6}
    .t2-start-btn{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:12px;padding:14px 32px;font-size:15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px;margin-top:20px;transition:opacity .2s,transform .2s;box-shadow:0 4px 14px rgba(118,75,162,.35)}
    .t2-start-btn:hover{opacity:.9;transform:translateY(-1px)}
    .t2-draft-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fefce8;border:1.5px solid #fde047;border-radius:12px;padding:12px 16px;margin-top:16px;flex-wrap:wrap}
    .t2-draft-info{font-size:13px;color:#713f12;line-height:1.5}
    .t2-resume-btn{background:linear-gradient(135deg,#f59e0b,#d97706);color:#fff;border:none;border-radius:9px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:opacity .2s}
    .t2-resume-btn:hover{opacity:.88}
    .t2-dismiss-btn{background:none;border:1.5px solid #d1d5db;color:#6b7280;border-radius:9px;padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;transition:border-color .2s,color .2s}
    .t2-dismiss-btn:hover{border-color:#9ca3af;color:#374151}
    [data-theme="dark"] .t2-dismiss-btn{border-color:#475569;color:#94a3b8}
    [data-theme="dark"] .t2-dismiss-btn:hover{border-color:#64748b;color:#cbd5e1}
    [data-theme="dark"] .t2-draft-banner{background:#1c1a00;border-color:#92400e}
    [data-theme="dark"] .t2-draft-info{color:#fde68a}

    /* ── Practice: header + question card ── */
    .t2-prompt-box{background:#fefce8;border:1.5px solid #fde047;border-radius:10px;padding:10px 14px;margin:0 20px 12px;font-size:13px;color:#713f12;line-height:1.6}
    .t2-prompt-box-label{font-weight:700;color:#92400e;font-size:13px;margin-bottom:4px}
    .t2-prompt-box p{margin:4px 0 0}
    .t2-structure-hint{display:flex;align-items:flex-start;gap:6px;background:#eff6ff;border-left:3px solid #3b82f6;border-radius:0 6px 6px 0;padding:6px 10px;margin:8px 0 6px;font-size:12px;color:#1d4ed8;line-height:1.5}
    .t2-structure-hint-label{font-weight:700;white-space:nowrap;flex-shrink:0}
    [data-theme="dark"] .t2-structure-hint{background:#1e3a5f;border-color:#3b82f6;color:#93c5fd}
    .t2-kw-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0 6px}
    .t2-kw-label{font-size:11px;font-weight:800;letter-spacing:.03em;color:#92400e;text-transform:uppercase;flex-shrink:0}
    .t2-kw-chip{font-size:12.5px;font-weight:600;color:#92400e;background:#fef3c7;border:1px solid #fde68a;border-radius:20px;padding:2px 10px}
    [data-theme="dark"] .t2-kw-label{color:#fcd34d}
    [data-theme="dark"] .t2-kw-chip{background:#3a2c0a;border-color:#5c4611;color:#fcd34d}
    .t2-vi-row{display:flex;align-items:flex-start;gap:8px;background:#eef2ff;border-left:3px solid #6366f1;border-radius:0 6px 6px 0;padding:7px 10px;margin:8px 0 6px}
    .t2-vi-label{font-size:11px;font-weight:800;letter-spacing:.03em;color:#4338ca;text-transform:uppercase;flex-shrink:0;white-space:nowrap}
    .t2-vi-text{font-size:13.5px;font-weight:700;line-height:1.5;color:var(--text,#111827)}
    [data-theme="dark"] .t2-vi-row{background:#1e1b4b;border-color:#6366f1}
    [data-theme="dark"] .t2-vi-label{color:#c4b5fd}
    [data-theme="dark"] .t2-vi-text{color:#e5e7eb}

    /* ── Answer word-count / letter-pattern hint ── */
    .t2-answer-hint{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 2px;font-size:12px}
    .t2-answer-hint-count{background:#f3f4f6;color:#4b5563;border-radius:20px;padding:2px 10px;font-weight:700;white-space:nowrap}
    .t2-answer-hint-pattern{font-family:'Courier New',monospace;letter-spacing:1px;color:#9ca3af;font-weight:700}
    [data-theme="dark"] .t2-answer-hint-count{background:var(--surface, #0d0d0d);color:#94a3b8}
    [data-theme="dark"] .t2-answer-hint-pattern{color:#64748b}

    /* ── AI grading badge ── */
    .t2-ai-badge{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:10px;margin-left:8px;vertical-align:middle;letter-spacing:.3px}
    [data-theme="dark"] .t2-ai-badge{background:linear-gradient(135deg,#4f46e5,#7c3aed)}

    .t2-mc-options{display:flex;flex-direction:column;gap:8px;margin:10px 0}
    .t2-mc-option{background:#f9fafb;border:1.5px solid #e5e7eb;border-radius:10px;padding:10px 14px;cursor:pointer;font-size:14px;text-align:left;transition:all .2s;display:flex;align-items:flex-start;gap:10px;width:100%}
    .t2-mc-option:hover{border-color:#6366f1;background:#f0f0ff}
    .t2-mc-option.selected{border-color:#6366f1;background:#ede9fe;font-weight:600}
    .t2-mc-option.correct{border-color:#16a34a;background:#dcfce7}
    .t2-mc-option.wrong{border-color:#dc2626;background:#fee2e2}
    .t2-mc-option .t2-opt-letter{width:22px;height:22px;border-radius:50%;background:#e5e7eb;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px}
    .t2-mc-option.selected .t2-opt-letter{background:#6366f1;color:#fff}
    .t2-mc-option.correct .t2-opt-letter{background:#16a34a;color:#fff}
    .t2-mc-option.wrong .t2-opt-letter{background:#dc2626;color:#fff}
    [data-theme="dark"] .t2-mc-option{background:var(--surface, #0d0d0d);border-color:var(--border2, #333333);color:#f1f5f9}
    [data-theme="dark"] .t2-mc-option:hover{border-color:#6366f1;background:#1e1b4b}
    [data-theme="dark"] .t2-mc-option.selected{border-color:#6366f1;background:#1e1b4b}
    [data-theme="dark"] .t2-mc-option .t2-opt-letter{background:var(--border2, #333333);color:#94a3b8}
    [data-theme="dark"] .t2-mc-option.correct{border-color:#16a34a;background:#14532d;color:#f1f5f9}
    [data-theme="dark"] .t2-mc-option.wrong{border-color:#dc2626;background:#450a0a;color:#f1f5f9}
    [data-theme="dark"] .t2-mc-option.correct .t2-opt-letter{background:#16a34a;color:#fff}
    [data-theme="dark"] .t2-mc-option.wrong .t2-opt-letter{background:#dc2626;color:#fff}

    /* ── Word count ── */
    .t2-word-count{font-size:11px;color:#9ca3af;text-align:right;margin-top:4px}
    .t2-word-count.good{color:#16a34a;font-weight:700}

    /* ── Explanation box ── */
    .t2-explanation{background:#f0fdf4;border:1.5px solid #86efac;border-radius:10px;padding:12px 14px;margin:8px 0;font-size:13px}
    .t2-explanation .t2-exp-title{font-weight:700;color:#15803d;margin-bottom:6px}
    .t2-explanation .t2-exp-body{color:#166534;line-height:1.6}
    [data-theme="dark"] .t2-explanation{background:#0f2d1a;border-color:#166534}
    [data-theme="dark"] .t2-explanation .t2-exp-title{color:#4ade80}
    [data-theme="dark"] .t2-explanation .t2-exp-body{color:#86efac}

    /* ── Done screen ── */
    .t2-done{text-align:center;padding:40px 20px;max-width:480px;margin:0 auto}
    .t2-done-icon{font-size:60px;line-height:1;margin-bottom:12px}
    .t2-done-score{font-size:48px;font-weight:900;margin:8px 0}
    .t2-done-sub{font-size:15px;color:#6b7280;margin-bottom:24px}
    .t2-done-stats{display:flex;gap:20px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
    .t2-done-stat{text-align:center}
    .t2-done-stat-num{font-size:26px;font-weight:900;color:#6366f1}
    .t2-done-stat-lbl{font-size:12px;color:#6b7280}


    /* ── Submit button disabled ── */
    .wp-submit-btn:disabled{opacity:.45;cursor:not-allowed}
    /* ── Writing textarea ── */
    .t2-writing-area{min-height:120px;resize:vertical}
    /* ── Question status dots ── */
    .t2-q-dots{display:flex;gap:5px;padding:4px 20px 6px;justify-content:center;flex-wrap:wrap}
    .t2-q-dot{width:9px;height:9px;border-radius:50%;background:#d1d5db;transition:background .25s,transform .2s;flex-shrink:0}
    .t2-dot-ok{background:#16a34a}
    .t2-dot-err{background:#dc2626}
    .t2-dot-current{background:#6366f1;transform:scale(1.35);box-shadow:0 0 0 2px #c7d2fe}
    [data-theme="dark"] .t2-q-dot{background:var(--border2, #333333)}
    [data-theme="dark"] .t2-dot-current{box-shadow:0 0 0 2px #3730a3}
    #q-dots .t2-q-dot{cursor:pointer}
    #q-dots .t2-q-dot:hover{transform:scale(1.5)}
    /* ── Practice header: week + topic ── */
    .t2-ctx-week{font-weight:700;color:#6366f1;background:#ede9fe;padding:2px 10px;border-radius:20px}
    [data-theme="dark"] .t2-ctx-week{background:#1e1b4b;color:#a5b4fc}
    .t2-ctx-name{font-weight:600;color:#374151;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    [data-theme="dark"] .t2-ctx-name{color:#cbd5e1}
    /* ── Quit modal ── */
    .t2-quit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:10000;backdrop-filter:blur(2px)}
    .t2-quit-overlay.hidden{display:none}
    .t2-quit-box{background:#fff;border-radius:18px;width:320px;overflow:hidden;box-shadow:0 24px 64px rgba(0,0,0,.28);animation:t2QuitIn .2s ease}
    @keyframes t2QuitIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
    .t2-quit-top{background:linear-gradient(135deg,#fff7ed,#fef3c7);padding:28px 24px 18px;text-align:center}
    .t2-quit-mascot{font-size:44px;line-height:1}
    .t2-quit-title{font-size:17px;font-weight:800;color:#92400e;margin:10px 0 5px}
    .t2-quit-sub{font-size:13px;color:#6b7280;line-height:1.5}
    .t2-quit-actions{padding:18px 24px;display:flex;flex-direction:column;gap:10px}
    .t2-quit-continue{background:#6366f1;color:#fff;border:none;border-radius:10px;padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
    .t2-quit-continue:hover{background:#4f46e5}
    .t2-quit-leave{background:none;color:#6b7280;border:1.5px solid #e5e7eb;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer}
    .t2-quit-leave:hover{border-color:#e53935;color:#e53935}
    .t2-quit-save{background:none;color:#059669;border:1.5px solid #6ee7b7;border-radius:10px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
    .t2-quit-save:hover{background:#ecfdf5;border-color:#10b981}
    .t2-quit-save.hidden{display:none}
    [data-theme="dark"] .t2-quit-box{background:var(--surface, #0d0d0d)}
    [data-theme="dark"] .t2-quit-top{background:linear-gradient(135deg,#1e1b4b,#2e1b0e)}
    [data-theme="dark"] .t2-quit-title{color:#fbbf24}
    [data-theme="dark"] .t2-quit-leave{border-color:var(--border2, #333333);color:#9ca3af}
    [data-theme="dark"] .t2-quit-save{color:#34d399;border-color:#065f46}
    [data-theme="dark"] .t2-quit-save:hover{background:#064e3b;border-color:#34d399}

    /* ── Test countdown timer ── */
    .wp-test-timer{display:inline-flex;align-items:center;gap:4px;background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:8px;padding:3px 10px;font-size:13px;font-weight:700;color:#15803d;font-variant-numeric:tabular-nums;transition:background .3s,color .3s,border-color .3s}
    .wp-test-timer.warn{background:#fff7ed;border-color:#fed7aa;color:#c2410c}
    .wp-test-timer.danger{background:#fff1f2;border-color:#fecaca;color:#dc2626;animation:timerPulse .8s ease-in-out infinite}
    @keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.5}}
    [data-theme="dark"] .wp-test-timer{background:#14532d;border-color:#166534;color:#86efac}
    [data-theme="dark"] .wp-test-timer.warn{background:#431407;border-color:#9a3412;color:#fdba74}
    [data-theme="dark"] .wp-test-timer.danger{background:#450a0a;border-color:#7f1d1d;color:#fca5a5}

    /* ── Brainstorm step (think first, then reveal) ── */
    .t2-brainstorm{margin-top:14px;border:1px solid #e0e7ff;background:#f5f6ff;border-radius:12px;padding:12px 14px}
    [data-theme="dark"] .t2-brainstorm{background:#161a2e;border-color:#2b3357}
    .t2-brainstorm-title{font-size:13px;font-weight:800;color:#4338ca}
    [data-theme="dark"] .t2-brainstorm-title{color:#a5b4fc}
    .t2-brainstorm-sub{font-size:12px;color:#6b7280;margin:3px 0 8px;line-height:1.5}
    [data-theme="dark"] .t2-brainstorm-sub{color:#94a3b8}
    .t2-brainstorm-side{display:block;font-size:12px;font-weight:700;color:#374151;margin:8px 0 3px}
    [data-theme="dark"] .t2-brainstorm-side{color:#cbd5e1}
    .t2-brainstorm-input{width:100%;box-sizing:border-box;font-family:inherit;font-size:13px;line-height:1.5;padding:7px 10px;border:1px solid #d1d5db;border-radius:8px;resize:vertical;background:#fff;color:#111827}
    [data-theme="dark"] .t2-brainstorm-input{background:#0d0d0d;border-color:#333;color:#f1f5f9}
    .t2-brainstorm-reveal{margin-top:10px}
    .t2-brainstorm-reveal>summary{cursor:pointer;font-size:12.5px;font-weight:700;color:#6366f1;list-style:none;user-select:none}
    .t2-brainstorm-reveal>summary::-webkit-details-marker{display:none}
    .t2-brainstorm-reveal>summary::before{content:'▸ ';font-weight:900}
    .t2-brainstorm-reveal[open]>summary::before{content:'▾ '}
    .t2-brainstorm-hint-side{font-size:12px;font-weight:700;color:#4338ca;margin:8px 0 2px}
    [data-theme="dark"] .t2-brainstorm-hint-side{color:#a5b4fc}
    .t2-brainstorm-hint-list{margin:0 0 4px;padding-left:20px;font-size:12.5px;color:#4b5563;line-height:1.6}
    [data-theme="dark"] .t2-brainstorm-hint-list{color:#cbd5e1}

    /* ── Auto-next countdown bar ── */
    @keyframes t2CountdownBar{from{width:100%}to{width:0%}}
    .t2-countdown-bar{height:3px;background:#6366f1;border-radius:2px;margin-top:6px;animation:t2CountdownBar var(--cd-dur,1.5s) linear forwards}

    /* ── Back button ── */
    .t2-back-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border:1.5px solid #e5e7eb;border-radius:8px;background:none;font-size:13px;font-weight:600;color:#374151;cursor:pointer;transition:all .15s;font-family:inherit;flex-shrink:0}
    .t2-back-btn:hover{border-color:#6366f1;color:#6366f1}
    [data-theme="dark"] .t2-back-btn{border-color:var(--border2, #333333);color:#9ca3af}
    [data-theme="dark"] .t2-back-btn:hover{border-color:#818cf8;color:#a5b4fc}

    /* ── Page-level headings / sub-text (rendered inside #app) ── */
    .t2-page-h2{font-weight:800;color:#111827;margin:0 0 4px}
    .t2-page-sub{color:#6b7280;margin:0}
    [data-theme="dark"] .t2-page-h2{color:#f1f5f9}
    [data-theme="dark"] .t2-page-sub{color:#9ca3af}
    [data-theme="dark"] .t2-done-sub{color:#9ca3af}
    [data-theme="dark"] .t2-done-stat-lbl{color:#64748b}
    [data-theme="dark"] .t2-selector-prompt{background:#0c1e30;border-color:#1e4060;color:#93c5fd}

    /* ── History modal (task2) ── */
    .t2-hist-modal{background:#fff;border-radius:16px;width:100%;max-width:520px;max-height:80vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.25)}
    .t2-hist-hdr{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #f3f4f6}
    .t2-hist-hdr h3{margin:0;font-size:16px;font-weight:800;color:#111827}
    .t2-hist-close{background:none;border:none;font-size:18px;color:#9ca3af;cursor:pointer;line-height:1;padding:4px}
    .t2-hist-close:hover{color:#374151}
    .t2-hist-body2{overflow-y:auto;padding:16px 20px;flex:1}
    .t2-hist-stats{display:flex;gap:10px;margin-bottom:16px}
    .t2-hist-stat{flex:1;text-align:center;background:#f9fafb;border-radius:10px;padding:12px 6px;border:1px solid #f3f4f6}
    .t2-hist-num{font-size:20px;font-weight:800;color:#111827}
    .t2-hist-lbl{font-size:11px;color:#9ca3af;margin-top:2px}
    .t2-hist-entry{padding:10px 12px;border-radius:10px;border:1px solid #f3f4f6;margin-bottom:8px;background:#fafafa}
    .t2-hist-entry-date{font-size:11px;color:#9ca3af;margin-bottom:3px}
    .t2-hist-entry-name{font-size:12px;font-weight:600;color:#374151;margin-bottom:5px}
    .t2-hist-entry-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .t2-hist-entry-count{font-size:12px;color:#6b7280}
    .t2-hist-entry-acc{font-size:12px;font-weight:700;padding:1px 8px;border-radius:20px}
    .t2-hist-entry-acc.good{background:#dcfce7;color:#15803d}
    .t2-hist-entry-acc.mid{background:#fef3c7;color:#92400e}
    .t2-hist-entry-acc.bad{background:#fee2e2;color:#b91c1c}
    [data-theme="dark"] .t2-hist-modal{background:var(--surface, #0d0d0d)}
    [data-theme="dark"] .t2-hist-hdr{border-color:var(--border2, #333333)}
    [data-theme="dark"] .t2-hist-hdr h3{color:#f1f5f9}
    [data-theme="dark"] .t2-hist-close{color:#64748b}
    [data-theme="dark"] .t2-hist-close:hover{color:#f1f5f9}
    [data-theme="dark"] .t2-hist-stat{background:var(--bg, #000000);border-color:var(--border2, #333333)}
    [data-theme="dark"] .t2-hist-num{color:#f1f5f9}
    [data-theme="dark"] .t2-hist-entry{background:var(--bg, #000000);border-color:var(--border2, #333333)}
    [data-theme="dark"] .t2-hist-entry-name{color:#94a3b8}
    [data-theme="dark"] .t2-hist-entry-count{color:#64748b}
    .t2-hist-entry.is-clickable{cursor:pointer;transition:border-color .15s,background .15s}
    .t2-hist-entry.is-clickable:hover{border-color:#6366f1;background:#f5f3ff}
    [data-theme="dark"] .t2-hist-entry.is-clickable:hover{border-color:#818cf8;background:#1e1b3a}
    .t2-hist-entry-more{font-size:11px;font-weight:700;color:#6366f1;margin-left:auto;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
    [data-theme="dark"] .t2-hist-entry-more{color:#a5b4fc}

    /* ── Task2: override shared writing-practice.css to match purple theme ── */
    /* Desktop stats widget (Task 2 override: 3 boxes in a row, like task1) */
    #t2-stats-widget .wp-stats-row{flex-wrap:nowrap}

    /* Purple progress bar */
    .wp-progress-bar { background: linear-gradient(90deg, #6366f1, #8b5cf6) !important; }

    /* Purple submit button */
    .wp-submit-btn { background: #6366f1 !important; box-shadow: 0 2px 8px rgba(99,102,241,.25) !important; }
    .wp-submit-btn:hover:not(:disabled) { background: #4f46e5 !important; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(99,102,241,.35) !important; }
    [data-theme="dark"] .wp-submit-btn { background: #4f46e5 !important; }
    [data-theme="dark"] .wp-submit-btn:hover:not(:disabled) { background: #4338ca !important; }

    /* Purple next button */
    .wp-next-btn { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%) !important; box-shadow: 0 2px 8px rgba(99,102,241,.3) !important; }
    .wp-next-btn:hover { box-shadow: 0 4px 14px rgba(99,102,241,.4) !important; }

    /* Topic card with draft */
    .t2-topic-card.has-draft { border-color: #f59e0b; background: #fffbeb; }
    .t2-topic-card.has-draft:hover { border-color: #d97706; background: #fef3c7; }
    [data-theme="dark"] .t2-topic-card.has-draft { border-color: #d97706; background: #1c1a0e; }
    [data-theme="dark"] .t2-topic-card.has-draft:hover { background: #292008; }

    /* Readable question text */
    .t2-question-text {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
      line-height: 1.65;
      margin-bottom: 14px;
      white-space: pre-line;
    }
    [data-theme="dark"] .t2-question-text { color: #f1f5f9; }

    /* ── Word-by-word "Dịch câu" typing drill ───────────────── */
    .t2-wbw { margin-top: 10px; }
    .t2-wbw-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      margin-bottom: 8px; font-size: 12px;
    }
    .t2-wbw-count {
      background: #f3f4f6; color: #4b5563; border-radius: 20px;
      padding: 3px 11px; font-weight: 800; white-space: nowrap;
      transition: background .2s, color .2s;
    }
    .t2-wbw-count.is-full { background: #dcfce7; color: #15803d; }
    .t2-wbw-words {
      display: flex; flex-wrap: wrap; gap: 7px 8px;
      padding: 12px; border-radius: 12px; background: #f9fafb;
      border: 1px solid #eef0f3; min-height: 44px; align-content: flex-start;
    }
    .t2-wbw-word {
      font-family: 'Courier New', ui-monospace, monospace;
      font-size: 14px; font-weight: 700; letter-spacing: .5px;
      padding: 5px 10px; border-radius: 8px; white-space: nowrap;
      background: #eef0f3; color: #9ca3af; border: 1.5px solid transparent;
      transition: background .18s, color .18s, border-color .18s, transform .18s;
    }
    .t2-wbw-word.is-done {
      background: #dcfce7; color: #15803d; border-color: #86efac;
    }
    .t2-wbw-word.just-done { animation: t2-wbw-pop .34s ease; }
    .t2-wbw-word.is-active {
      background: #fff; color: #111827; border-color: #f59e0b;
      box-shadow: 0 0 0 3px rgba(245,158,11,.15);
    }
    .t2-wbw-word.is-active .t2-wbw-star { color: #d1d5db; }
    .t2-wbw-word.is-active.is-error {
      border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.18);
      animation: t2-wbw-shake .24s ease;
    }
    .t2-wbw-err { color: #ef4444; }
    .t2-wbw-caret {
      display: inline-block; width: 1px; margin: 0 1px;
      border-left: 2px solid #f59e0b; animation: t2-wbw-blink 1s step-end infinite;
    }
    .t2-wbw-input {
      margin-top: 10px; width: 100%; box-sizing: border-box;
      font-family: 'Courier New', ui-monospace, monospace;
      font-size: 16px; font-weight: 700; letter-spacing: 1px;
      padding: 10px 12px; border-radius: 10px;
      border: 1.5px solid #d1d5db; background: #fff; color: #111827;
      transition: border-color .18s, box-shadow .18s, background .18s;
    }
    .t2-wbw-input:focus { outline: none; border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.15); }
    .t2-wbw-input.is-error {
      border-color: #ef4444; background: #fef2f2;
      box-shadow: 0 0 0 3px rgba(239,68,68,.18); animation: t2-wbw-shake .24s ease;
    }
    .t2-wbw-input:disabled { background: #f3f4f6; color: #9ca3af; }
    [data-theme="dark"] .t2-wbw-input { background: #0d0d0d; border-color: #334155; color: #f1f5f9; }
    [data-theme="dark"] .t2-wbw-input:disabled { background: #1e293b; color: #64748b; }
    .t2-wbw-hint {
      margin-top: 7px; font-size: 11.5px; color: #9ca3af;
    }
    .t2-wbw.hidden { display: none; }
    @keyframes t2-wbw-shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-4px); }
      40% { transform: translateX(4px); }
      60% { transform: translateX(-3px); }
      80% { transform: translateX(2px); }
    }
    @keyframes t2-wbw-pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.12); }
      100% { transform: scale(1); }
    }
    @keyframes t2-wbw-blink { 50% { opacity: 0; } }
    [data-theme="dark"] .t2-wbw-words { background: #0f172a; border-color: #1e293b; }
    [data-theme="dark"] .t2-wbw-word { background: #1e293b; color: #64748b; }
    [data-theme="dark"] .t2-wbw-word.is-done { background: #052e16; color: #4ade80; border-color: #166534; }
    [data-theme="dark"] .t2-wbw-word.is-active { background: #0d0d0d; color: #f1f5f9; }
    [data-theme="dark"] .t2-wbw-count { background: var(--surface, #0d0d0d); color: #94a3b8; }
    [data-theme="dark"] .t2-wbw-count.is-full { background: #052e16; color: #4ade80; }
    @media (max-width: 640px) {
      .t2-wbw-word { font-size: 15px; }
    }

    /* ══ Weeks screen: grouped by essay type ══ */
    .t2-page-head{padding:20px 20px 4px;display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:8px}
    .t2-flow-hint{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 20px 4px;font-size:12.5px;color:#6b7280}
    .t2-flow-hint b{color:#4338ca;background:#eef2ff;border-radius:20px;padding:2px 10px;font-weight:700}
    .t2-flow-hint i{font-size:9px;color:#c7d2fe}
    [data-theme="dark"] .t2-flow-hint b{background:#1e1b4b;color:#a5b4fc}
    .t2-group-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;padding:12px 20px 20px}
    .t2-group{background:var(--surface,#fff);border:1.5px solid #e5e7eb;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px}
    .t2-group.is-review{grid-column:1/-1}
    .t2-group-head{display:flex;align-items:center;gap:10px}
    .t2-group-emoji{font-size:26px;line-height:1}
    .t2-group-theme{font-size:15px;font-weight:800;color:#111827;margin-bottom:3px}
    .t2-badge-mixed{background:#f3f4f6;color:#4b5563}
    .t2-group-weeks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .t2-group.is-review .t2-group-weeks{grid-template-columns:repeat(4,1fr)}
    .t2-wk{border:1.5px solid #e5e7eb;border-radius:10px;background:#f9fafb;padding:10px 12px;cursor:pointer;text-align:left;font-family:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:2px;transition:border-color .15s,background .15s,transform .1s}
    .t2-wk:hover{border-color:#6366f1;background:#f0f0ff}
    .t2-wk:active{transform:scale(.97)}
    .t2-wk-num{font-size:15px;font-weight:800;color:#6366f1}
    .t2-wk-sub{font-size:12px;color:#6b7280}
    .t2-wk.has-draft{border-color:#f59e0b;background:#fffbeb}
    .t2-wk.locked{opacity:.45;cursor:not-allowed}
    .t2-wk .t2-week-draft-pill{margin-top:4px}
    [data-theme="dark"] .t2-group{background:var(--surface,#0d0d0d);border-color:var(--border2,#333)}
    [data-theme="dark"] .t2-group-theme{color:#f1f5f9}
    [data-theme="dark"] .t2-badge-mixed{background:#1f2937;color:#cbd5e1}
    [data-theme="dark"] .t2-wk{background:var(--bg,#000);border-color:var(--border2,#333)}
    [data-theme="dark"] .t2-wk:hover{border-color:#818cf8;background:#1e1b4b}
    [data-theme="dark"] .t2-wk.has-draft{border-color:#d97706;background:#1c1a0e}
    [data-theme="dark"] .t2-wk-sub{color:#94a3b8}
    @media(max-width:560px){.t2-group.is-review .t2-group-weeks{grid-template-columns:repeat(2,1fr)}}

    /* "Đang làm dở" — one-click resume straight from the weeks screen */
    .t2-continue{margin:8px 20px 4px;border:1.5px solid #fde68a;background:#fffbeb;border-radius:12px;padding:10px 14px}
    .t2-continue-title{font-size:11.5px;font-weight:800;color:#92400e;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;display:flex;align-items:center;gap:6px}
    .t2-continue-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px dashed #fde68a}
    .t2-continue-title+.t2-continue-row{border-top:none}
    .t2-continue-name{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:#111827;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .t2-continue-meta{font-weight:500;color:#92400e;font-size:12px}
    [data-theme="dark"] .t2-continue{background:#1c1a0e;border-color:#78350f}
    [data-theme="dark"] .t2-continue-row{border-color:#78350f}
    [data-theme="dark"] .t2-continue-name{color:#f1f5f9}
    [data-theme="dark"] .t2-continue-title,[data-theme="dark"] .t2-continue-meta{color:#fcd34d}

    /* ══ Topics screen: per-topic progress chips ══ */
    .t2-topic-steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
    .t2-step-chip{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:#f3f4f6;color:#6b7280;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
    .t2-step-chip.ok{background:#dcfce7;color:#15803d}
    .t2-step-chip.mid{background:#fef3c7;color:#92400e}
    [data-theme="dark"] .t2-step-chip{background:#1f2937;color:#94a3b8}
    [data-theme="dark"] .t2-step-chip.ok{background:#052e16;color:#4ade80}
    [data-theme="dark"] .t2-step-chip.mid{background:#3a2c0a;color:#fcd34d}

    /* ══ Topic hub: 3-step path (Từ vựng → Luyện câu → Viết bài) ══ */
    .t2-nav-row{justify-content:space-between;max-width:720px;margin:0 auto}
    .t2-icon-btn{width:34px;height:34px;border-radius:9px;border:1.5px solid #e5e7eb;background:none;color:#6b7280;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:13px;transition:border-color .15s,color .15s}
    .t2-icon-btn:hover{border-color:#6366f1;color:#6366f1}
    [data-theme="dark"] .t2-icon-btn{border-color:var(--border2,#333);color:#94a3b8}
    .t2-hub{max-width:720px;margin:0 auto;padding:0 20px 24px}
    .t2-hub-head{display:flex;gap:12px;align-items:center}
    .t2-hub-emoji{font-size:36px;line-height:1}
    .t2-hub-title{font-size:20px;font-weight:800;color:#111827;margin:0 0 4px}
    [data-theme="dark"] .t2-hub-title{color:#f1f5f9}
    .t2-stepper{display:flex;gap:6px;margin:14px 0 4px}
    .t2-stepper-item{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#f3f4f6;color:#6b7280;cursor:pointer;border:none;font-family:inherit;text-align:left}
    .t2-stepper-num{width:22px;height:22px;border-radius:50%;background:#d1d5db;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
    .t2-stepper-txt{min-width:0;font-size:12.5px;font-weight:800;line-height:1.25}
    .t2-stepper-sub{display:block;font-size:11px;font-weight:600;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .t2-stepper-item.is-done{background:#dcfce7;color:#15803d}
    .t2-stepper-item.is-done .t2-stepper-num{background:#16a34a}
    .t2-stepper-item.is-current{background:#ede9fe;color:#4338ca}
    .t2-stepper-item.is-current .t2-stepper-num{background:#6366f1}
    [data-theme="dark"] .t2-stepper-item{background:#1f2937;color:#94a3b8}
    [data-theme="dark"] .t2-stepper-num{background:#374151}
    [data-theme="dark"] .t2-stepper-item.is-done{background:#052e16;color:#4ade80}
    [data-theme="dark"] .t2-stepper-item.is-current{background:#1e1b4b;color:#a5b4fc}
    .t2-step{border:1.5px solid #e5e7eb;border-radius:14px;padding:16px;margin-top:12px;background:var(--surface,#fff);scroll-margin-top:80px}
    .t2-step.is-current{border-color:#c7d2fe;box-shadow:0 4px 18px rgba(99,102,241,.10)}
    .t2-step.is-locked{background:#f9fafb}
    .t2-step.is-locked .t2-step-title{color:#9ca3af}
    [data-theme="dark"] .t2-step{background:var(--surface,#0d0d0d);border-color:var(--border2,#333)}
    [data-theme="dark"] .t2-step.is-current{border-color:#3730a3}
    [data-theme="dark"] .t2-step.is-locked{background:var(--bg,#000)}
    .t2-step-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .t2-step-num{width:26px;height:26px;border-radius:50%;background:#6366f1;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0}
    .t2-step.is-locked .t2-step-num{background:#d1d5db}
    .t2-step-num.is-done{background:#16a34a}
    .t2-step-num.is-alt{background:#f3f4f6;color:#6b7280}
    [data-theme="dark"] .t2-step-num.is-alt{background:#1f2937;color:#94a3b8}
    .t2-step-title{flex:1;min-width:0;font-size:15.5px;font-weight:800;color:#111827}
    [data-theme="dark"] .t2-step-title{color:#f1f5f9}
    .t2-step-tag{font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:20px;background:#f3f4f6;color:#6b7280;white-space:nowrap}
    .t2-step-tag.ok{background:#dcfce7;color:#15803d}
    .t2-step-tag.mid{background:#fef3c7;color:#92400e}
    [data-theme="dark"] .t2-step-tag{background:#1f2937;color:#94a3b8}
    [data-theme="dark"] .t2-step-tag.ok{background:#052e16;color:#4ade80}
    [data-theme="dark"] .t2-step-tag.mid{background:#3a2c0a;color:#fcd34d}
    .t2-opt-tag{font-size:10.5px;font-weight:700;color:#9ca3af;background:#f3f4f6;border-radius:20px;padding:1px 8px;margin-left:4px;vertical-align:middle}
    [data-theme="dark"] .t2-opt-tag{background:#1f2937}
    .t2-step-desc{font-size:13px;color:#6b7280;margin:8px 0 10px;line-height:1.6}
    [data-theme="dark"] .t2-step-desc{color:#94a3b8}
    .t2-meter{height:7px;border-radius:7px;background:#eef0f3;overflow:hidden;margin:4px 0 12px}
    .t2-meter>span{display:block;height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);border-radius:7px;transition:width .35s}
    .t2-meter.ok>span{background:#16a34a}
    [data-theme="dark"] .t2-meter{background:#1f2937}
    .t2-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .t2-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-family:inherit;box-shadow:0 3px 10px rgba(99,102,241,.25);transition:opacity .15s,transform .1s}
    .t2-primary:hover{opacity:.92}
    .t2-primary:active{transform:scale(.97)}
    .t2-primary:disabled{opacity:.55;cursor:default}
    .t2-primary.is-lg{padding:12px 24px;font-size:15px}
    .t2-primary.is-sm{padding:6px 12px;font-size:12.5px;box-shadow:none}
    .t2-primary.is-write{background:linear-gradient(135deg,#e53935,#c62828);box-shadow:0 3px 10px rgba(229,57,53,.25)}
    .t2-secondary{border:1.5px solid #e5e7eb;background:var(--surface,#fff);color:#374151;border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit;transition:border-color .15s,color .15s}
    .t2-secondary:hover:not(:disabled){border-color:#6366f1;color:#4338ca}
    .t2-secondary:disabled{opacity:.5;cursor:default}
    .t2-secondary.is-warn{border-color:#fcd34d;color:#92400e;background:#fffbeb}
    [data-theme="dark"] .t2-secondary{background:transparent;border-color:var(--border2,#333);color:#cbd5e1}
    [data-theme="dark"] .t2-secondary.is-warn{border-color:#78350f;color:#fcd34d;background:#1c1a0e}
    .t2-link{background:none;border:none;color:#6366f1;font-weight:700;font-size:12.5px;cursor:pointer;padding:6px 2px;font-family:inherit;display:inline-flex;align-items:center;gap:5px}
    .t2-link:hover{text-decoration:underline}
    [data-theme="dark"] .t2-link{color:#a5b4fc}
    .t2-lock-note{display:flex;gap:8px;align-items:center;font-size:13px;color:#6b7280;background:#f3f4f6;border-radius:9px;padding:9px 12px}
    [data-theme="dark"] .t2-lock-note{background:#1f2937;color:#94a3b8}
    .t2-opts-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px}
    .t2-pill-toggle{border:1.5px solid #e5e7eb;background:none;color:#6b7280;border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit;transition:all .15s}
    .t2-pill-toggle::before{content:'';width:8px;height:8px;border-radius:50%;background:#d1d5db;transition:background .15s}
    .t2-pill-toggle.on{border-color:#6366f1;background:#eef2ff;color:#4338ca}
    .t2-pill-toggle.on::before{background:#6366f1}
    [data-theme="dark"] .t2-pill-toggle{border-color:var(--border2,#333);color:#94a3b8}
    [data-theme="dark"] .t2-pill-toggle.on{background:#1e1b4b;border-color:#818cf8;color:#a5b4fc}

<script>
// ════════════════════════════════════════════════════════
//  CONFIG
// ════════════════════════════════════════════════════════
const API = (window.AuthService && window.AuthService.API && window.AuthService.API.replace(/\/api\/?$/, '')) || 'https://englishwithdan.onrender.com';

// playOk/playWrong/toggleWpSound moved to js/shared/sound-effects.js
// (single source of truth — student UI audit Nhóm 2, 2026-07-25).

// showToast() moved to js/shared/toast.js (single source of truth — Phase 3 audit).

function _escHtml(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const ESSAY_LABELS = { advantages_disadvantages:'Adv & Disadv', cause_effect:'Cause & Effect', cause_solution:'Cause & Solution', effect_solution:'Effect & Solution', agree_disagree:'Agree / Disagree', discuss_both_views:'Discuss Both Views', positive_or_negative_development:'Positive or Negative Dev' };
const ESSAY_BADGE_CLASS = { advantages_disadvantages:'et-badge et-adv', cause_effect:'et-badge et-cause', cause_solution:'et-badge et-cause', effect_solution:'et-badge et-cause', agree_disagree:'et-badge et-opinion', discuss_both_views:'et-badge et-discuss', positive_or_negative_development:'et-badge et-posneg' };
const Q_LABELS = { essay_type_recognition:'Nhận diện dạng', fill_blank:'Điền chỗ trống', rearrange:'Sắp xếp từ', translation:'Dịch câu', error_correction:'Sửa lỗi', topic_sentence:'Chọn topic sentence', short_writing:'Viết đoạn', paraphrase:'Paraphrase' };
// Types that run the word-by-word "Dịch câu" typing drill (server ships a
// model sentence as q.translationAnswer for each). translation + paraphrase
// + the conclusion / short-writing prompts.
const WBW_TYPES = new Set(['translation', 'paraphrase', 'short_writing']);
const LEVEL_COLORS = { beginner:'#22c55e', elementary:'#3b82f6', intermediate:'#a855f7' };

// Each essay type spans 2 consecutive weeks (1 theme each, no theme repeated
// across blocks) — see restructure notes (2026). Weeks 15-18 stay "Ôn tập"
// (mixed review content). Ordered Type01→Type07 (matches Task2Topic.week
// reassignment in seedTask2Exercises.js and the WT1 Task 2 course's Module 2
// lesson order). The weeks screen renders one card per group.
const WEEK_GROUPS = [
  { essayType: 'advantages_disadvantages',         theme: 'Technology',      emoji: '💻', weeks: [1, 2] },
  { essayType: 'discuss_both_views',               theme: 'Government',      emoji: '🏛️', weeks: [3, 4] },
  { essayType: 'cause_solution',                   theme: 'Health',          emoji: '🩺', weeks: [5, 6] },
  { essayType: 'effect_solution',                  theme: 'Transport',       emoji: '🚆', weeks: [7, 8] },
  { essayType: 'cause_effect',                     theme: 'Education',       emoji: '🎓', weeks: [9, 10] },
  { essayType: 'agree_disagree',                   theme: 'Work',            emoji: '💼', weeks: [11, 12] },
  { essayType: 'positive_or_negative_development', theme: 'Environment',     emoji: '🌿', weeks: [13, 14] },
  { essayType: null,                               theme: 'Ôn tập tổng hợp', emoji: '🔁', weeks: [15, 16, 17, 18] }
];
function weekLabel(w) {
  const g = WEEK_GROUPS.find(g => g.weeks.includes(w));
  if (!g) return '';
  return g.essayType ? `${ESSAY_LABELS[g.essayType]} · ${g.theme}` : 'Ôn tập';
}

// ════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════
let _practiceKeyHandler = null;  // track listener to avoid accumulation

let state = {
  view: 'weeks',  // weeks | topics | select | practice | exam | vocab | done
  selectedWeek: null,
  selectedTopic: null,
  selectedLevel: 'all',  // level picker removed from practice UI — always "all" now
  currentMode: 'practice',  // practice | exam | vocab | retry
  weeks: [],
  topics: [],
  questions: [],
  vocab: [],
  currentIdx: 0,
  sessionDone: 0, sessionCorrect: 0,
  sessionAttempts: [],
  // rearrange
  rearrangeAnswer: [],
  rearrangeWords: [],
  // mc selected
  mcSelected: null,
  // exam
  examQuestions: [], examAnswers: [], examIdx: 0, examLevel: 'beginner', examCount: 10,
  examTimerInterval: null, examTimeLeft: 0, examTotalTime: 0,
  _isSubmitting: false,
  // wrong-question tracking (cross-session)
  wrongQuestionIds: [],
  // per-question status for progress dots
  questionStatus: [],
  // saved session draft for resuming
  draft: null,
  // this user's practice record for the selected topic ({practiced,bestScore,...})
  // — gates the "Viết bài ngay" button. Fetched in selectTopic().
  topicStats: null,
  // all drafts across topics (for week screen indicators)
  allDrafts: [],
  // settings toggles (remembered per browser — see _loadT2Prefs)
  autoNext: false,

  // vocabFor = the topic _id state.vocab belongs to; vocabError = last fetch failed.
  vocabFor: null,

  vocabQuiz: null,      // optional inline quiz — see startVocabQuiz()

  promptOpen: true      // practice screen's collapsible prompt box
};

const T2_PREFS_KEY = 't2_prefs';
(function _loadT2Prefs() {
  try {
    const p = JSON.parse(localStorage.getItem(T2_PREFS_KEY) || '{}');
    state.autoNext = !!p.autoNext;
    state.shuffleMode = !!p.shuffleMode;
  } catch {}
})();

let _autoNextTimer = null;
let _examKeyHandler = null;

// ════════════════════════════════════════════════════════
//  SHAREABLE URL
// ════════════════════════════════════════════════════════
function copyT2ShareUrl() {
  const params = new URLSearchParams();
  if (state.selectedWeek) params.set('week', state.selectedWeek);
  if (state.selectedTopic?._id) params.set('topicId', state.selectedTopic._id);
  const url = location.origin + location.pathname.split('?')[0] + '?' + params.toString();
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url)
      .then(() => showToast('Đã sao chép link chia sẻ!', 'info', 2500))
      .catch(() => _fallbackCopy(url));
  } else { _fallbackCopy(url); }
}
function _fallbackCopy(url) {
  const el = document.createElement('textarea');
  el.value = url; el.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
  document.body.appendChild(el); el.select();
  try { document.execCommand('copy'); showToast('Đã sao chép link chia sẻ!', 'info', 2500); }
  catch { showToast('Không sao chép được – hãy copy thủ công.', 'warn'); }
  document.body.removeChild(el);
}

// ════════════════════════════════════════════════════════
//  QUIT MODAL
// ════════════════════════════════════════════════════════
let _t2QuitCb = null;
let _t2QuitSaveCb = null;
let _vocabHintCount = 0;
let _vocabHintList  = [];
function askT2Quit(cb, opts = {}) {
  _t2QuitCb = cb;
  _t2QuitSaveCb = opts.onSave || null;
  document.getElementById('t2-quit-mascot').textContent   = opts.mascot      || '✏️';
  document.getElementById('t2-quit-title').textContent    = opts.title        || 'Dừng luyện tập?';
  document.getElementById('t2-quit-sub').textContent      = opts.sub          || '';
  document.getElementById('t2-quit-continue-btn').innerHTML = `<i class="fas fa-arrow-left"></i> ${opts.continueText || 'Tiếp tục học'}`;
  document.getElementById('t2-quit-leave-btn').innerHTML = '<i class="fas fa-sign-out-alt"></i> ' + (opts.confirmText || 'Dừng lại');
  const saveBtn = document.getElementById('t2-quit-save-btn');
  if (_t2QuitSaveCb) saveBtn.classList.remove('hidden');
  else saveBtn.classList.add('hidden');
  document.getElementById('t2-quit-overlay').classList.remove('hidden');
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('t2-quit-continue-btn').onclick = () =>
    document.getElementById('t2-quit-overlay').classList.add('hidden');
  document.getElementById('t2-quit-save-btn').onclick = () => {
    document.getElementById('t2-quit-overlay').classList.add('hidden');
    if (_t2QuitSaveCb) { _t2QuitSaveCb(); _t2QuitSaveCb = null; }
  };
  document.getElementById('t2-quit-leave-btn').onclick = () => {
    document.getElementById('t2-quit-overlay').classList.add('hidden');
    if (_t2QuitCb) { _t2QuitCb(); _t2QuitCb = null; }
  };
  // Close on backdrop click
  document.getElementById('t2-quit-overlay').addEventListener('click', e => {
    if (e.target === e.currentTarget) document.getElementById('t2-quit-overlay').classList.add('hidden');
  });
});

// ════════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {

  // #app is a stable container that render() only ever innerHTML's into —
  // one registration here covers every view (weeks/topics/practice/exam/...).
  // Gate: dict lookup must be off during an active "thi thử" run — only
  // active for ordinary practice, or once exam results are being shown
  // (state.view === 'examDone').
  setupDictionaryDouble('app', 'task2-practice',
    () => state.currentMode !== 'exam' || state.view === 'examDone');

  // "tra câu" sentence-lookup icon (js/shared/sentence-lookup.js) — same
  // exam condition as the dict-lookup gate above, just inverted.
  window.__ewsExamActive = () => state.currentMode === 'exam' && state.view !== 'examDone';
});

function initUser() {
  loadXPFromStorage();
}

function loadXPFromStorage() {
  const stored = _safeParse(localStorage.getItem('t2_progress'), { xp: 0, streak: 0 });
  document.getElementById('header-xp').textContent     = stored.xp     || 0;
  document.getElementById('header-streak').textContent = stored.streak  || 0;
}

function updateXPStorage(earned, incrementStreak = false) {
  const stored = _safeParse(localStorage.getItem('t2_progress'), { xp: 0, streak: 0 });
  stored.xp    = (stored.xp || 0) + earned;
  if (incrementStreak) stored.streak = (stored.streak || 0) + 1;
  localStorage.setItem('t2_progress', JSON.stringify(stored));
  document.getElementById('header-xp').textContent     = stored.xp;
  document.getElementById('header-streak').textContent = stored.streak;
}

// ── Per-topic completion tracking (bestScore/latestScore/completed/completedAt) ──
// Shared model with essential-grammar.html/task1-practice.html/task2-template.html/
// writing-practice.html. A topic "completes" once a practice session on it scores
// >=80% accuracy. Keyed by topic _id; total topic count for the progress badge is
// derived from whatever topics have been loaded into localStorage so far (a
// per-week API doesn't expose a single "total topics" count client-side).
const TOPIC_SCORE_KEY = 't2_topic_scores';
const TOPIC_COMPLETE_THRESHOLD = 80;
function _safeParse(json, fallback){ if(json==null) return fallback; try{ return JSON.parse(json); }catch{ return fallback; } }
let _topicScores = _safeParse(localStorage.getItem(TOPIC_SCORE_KEY), {});

function isTopicCompleted(topicId) { const s = _topicScores[topicId]; return !!(s && s.completed); }

function saveTopicScore(topicId, score) {
  const prev = _topicScores[topicId] || { bestScore: 0, latestScore: 0, completed: false, completedAt: null };
  const bestScore = Math.max(prev.bestScore, score);
  const completed = bestScore >= TOPIC_COMPLETE_THRESHOLD;
  const completedAt = (completed && !prev.completed) ? new Date().toISOString() : prev.completedAt;
  _topicScores[topicId] = { bestScore, latestScore: score, completed, completedAt };
  localStorage.setItem(TOPIC_SCORE_KEY, JSON.stringify(_topicScores));
}

function topicCompletedCount() {
  return Object.values(_topicScores).filter(s => s.completed).length;
}

// ── "Viết bài ngay" gate ──────────────────────────────────────────────────
// Full-essay writing is unlocked only after the student has practised this
// topic (at least one 'practice' session with questions) AND reached a best
// score of >= 70% on it. Server-verified via GET /api/task2/topic-stats/:id
// (state.topicStats), with the local _topicScores best as a fallback so a
// student who just finished a good session doesn't have to wait for a
// refetch to see it unlock.
const T2_WRITE_MIN_ACCURACY = 70;

function _bestPracticeScore(topicId) {
  // Only trust state.topicStats when it was loaded for THIS topic — a
  // back/forward nav can leave a previous topic's stats in place.
  const ts = state.topicStats;
  const server = (ts && ts.forTopic === topicId && ts.practiced) ? (ts.bestScore || 0) : null;
  const local  = _topicScores[topicId] ? (_topicScores[topicId].bestScore || 0) : null;
  if (server == null && local == null) return null; // never practised anywhere we can see
  return Math.max(server || 0, local || 0);
}

// Returns { ok, code, best }. code: 'ok' | 'not_practiced' | 'low_accuracy'.
function canWriteFullEssay(topicId) {
  const best = _bestPracticeScore(topicId);
  if (best == null) return { ok: false, code: 'not_practiced', best: 0 };
  if (best < T2_WRITE_MIN_ACCURACY) return { ok: false, code: 'low_accuracy', best };
  return { ok: true, code: 'ok', best };
}

function writeGateMessage(gate) {
  if (gate.code === 'not_practiced') {
    return `Hãy hoàn thành phần "Luyện tập" của chủ đề này trước đã. ` +
           `Bạn cần đạt tối thiểu ${T2_WRITE_MIN_ACCURACY}% số câu đúng (điểm cao nhất) thì nút "Viết bài ngay" mới mở khoá.`;
  }
  return `Bạn mới đạt cao nhất ${gate.best}% ở phần "Luyện tập". ` +
         `Cần tối thiểu ${T2_WRITE_MIN_ACCURACY}% mới mở khoá "Viết bài ngay" — hãy luyện thêm ` +
         `(hoặc dùng "Ôn câu sai") rồi thử lại.`;
}

// ── Vocab-learned gate — Luyện tập requires the topic's vocab to have been
// opened (Từ vựng tab, which caches its total word count below) AND every
// one of those terms saved into a VocabBook first. Same localStorage-keyed-
// by-topicId convention as _topicScores above; there is no server-side field
// for "has this student learned this topic's vocab" to check instead. ──
const VOCAB_TOTAL_KEY = 't2_vocab_total';
const VOCAB_SAVED_KEY = 't2_vocab_saved';
let _vocabTotalMap = _safeParse(localStorage.getItem(VOCAB_TOTAL_KEY), {});
let _vocabSavedMap  = _safeParse(localStorage.getItem(VOCAB_SAVED_KEY), {});

function _savedTermsForTopic(topicId) {
  return new Set(_vocabSavedMap[topicId] || []);
}

function _markVocabTermsSaved(topicId, terms) {
  const set = _savedTermsForTopic(topicId);
  terms.forEach(t => set.add(t));
  _vocabSavedMap[topicId] = Array.from(set);
  localStorage.setItem(VOCAB_SAVED_KEY, JSON.stringify(_vocabSavedMap));
}

function isVocabLearned(topicId) {
  if (!topicId) return false;
  const total = _vocabTotalMap[topicId];
  if (total === undefined) return false; // never opened the Từ vựng tab yet
  if (total <= 0) return true; // topic genuinely has no vocab list — nothing to gate on
  return _savedTermsForTopic(topicId).size >= total;
}

function topicStatusRowHtml(topicId) {
  const s = _topicScores[topicId];
  let html = '';
  if (s && s.completed) html += '<span class="wp-status-badge wp-status-done"><i class="fas fa-check-circle"></i> Đã hoàn thành</span>';
  if (s) html += '<span class="wp-status-badge wp-status-best"><i class="fas fa-star"></i> Điểm cao nhất: ' + s.bestScore + '%</span>';
  html += '<span class="wp-status-badge"><i class="fas fa-chart-line"></i> Đã hoàn thành ' + topicCompletedCount() + ' chủ đề</span>';
  return html;
}

function updateSessionStats() {
  const el = document.getElementById('mob-stat-done');
  const xpEl = document.getElementById('mob-stat-xp');
  const okEl = document.getElementById('mob-stat-correct');
  const pct = state.sessionDone > 0
    ? Math.round((state.sessionCorrect / state.sessionDone) * 100) + '%' : '–';
  const xp = (_safeParse(localStorage.getItem('t2_progress'), { xp: 0 }).xp) || 0;
  if (el) el.textContent = state.sessionDone;
  if (okEl) okEl.textContent = pct;
  if (xpEl) xpEl.textContent = xp;

  const wd = document.getElementById('widget-done');
  if (wd) {
    wd.textContent = state.sessionDone;
    document.getElementById('widget-xp').textContent      = xp;
    document.getElementById('widget-correct').textContent = pct;
  }
}

//  RENDER DISPATCHER
// ════════════════════════════════════════════════════════
function render() {
  const app = document.getElementById('app');
  switch (state.view) {
    case 'weeks':    app.innerHTML = renderWeeks();    bindWeeks();    break;
    case 'topics':   app.innerHTML = renderTopics();   bindTopics();   break;
    case 'select':   app.innerHTML = renderSelect();   bindSelect();   break;
    case 'practice': app.innerHTML = renderPractice(); bindPractice(); break;
    case 'exam':     app.innerHTML = renderExam();     bindExam();     break;
    case 'examDone': app.innerHTML = renderExamDone(); break;
    case 'done':     app.innerHTML = renderDone();     break;
  }
  // Session stats (BÀI LÀM/XP/ĐÚNG) only mean something once a practice
  // session is actually running — outside 'practice'/'done' they'd just be
  // stale zeros floating over the weeks/topics picker, which is the bug this
  // guards against. Desktop widget is fixed top-right (like task1/writing).
  const inSession = state.view === 'practice' || state.view === 'done';
  const widget = document.getElementById('t2-stats-widget');
  if (widget) widget.style.display = inSession ? '' : 'none';
  // Same for the mobile bar — '' hands visibility back to the media query.
  const mobBar = document.getElementById('wp-mobile-stats');
  if (mobBar) mobBar.style.display = inSession ? '' : 'none';
}

// ════════════════════════════════════════════════════════
//  API HELPERS
// ════════════════════════════════════════════════════════
// apiFetch keeps its own request-building and delegates response-handling
// (including the 401 check this file previously lacked entirely) to
// js/shared/api-client.js — single source of truth (Phase 3 audit).
async function apiFetch(path, opts = {}) {
  const token = window.AuthService.getToken();
  const headers = { 'Content-Type': 'application/json', ...(token ? { 'Authorization': 'Bearer ' + token } : {}) };
  // opts.timeoutMs: abort the request after N ms so a cold-started backend
  // can't leave a "Đang chấm bài..." spinner running forever.
  let signal = opts.signal, killer;
  if (opts.timeoutMs && !signal) {
    const ctrl = new AbortController();
    killer = setTimeout(() => ctrl.abort(), opts.timeoutMs);
    signal = ctrl.signal;
  }
  try {
    const res = await fetch(API + path, { ...opts, signal, headers: { ...headers, ...opts.headers } });
    return await window.ApiClient.handleResponse(res);
  } finally {
    if (killer) clearTimeout(killer);
  }
}

// ════════════════════════════════════════════════════════
//  WEEKS SCREEN
// ════════════════════════════════════════════════════════
async function loadWeeks() {
  const app = document.getElementById('app');
  app.innerHTML = '<div style="text-align:center;padding:40px"><div class="wp-spinner"></div><p>Đang tải...</p></div>';
  try {
    const params = new URLSearchParams(location.search);
    let   urlWeek    = parseInt(params.get('week')) || null;
    // Clean path /task2-practice/:topicId (a _redirects 200 rewrite to this
    // same file) — same additive pattern as reading-v2.js/listening.html's
    // RouteParams.match(): checked first, falls back to ?topicId= unchanged.
    // No fromCleanPath guard needed here (unlike the other pages this audit
    // touched) since the replaceState below reuses location.href as-is
    // rather than rebuilding a ?query= string, so it never clobbers a clean
    // path. Week doesn't need to come along either — the existing
    // urlTopicId-without-urlWeek fallback a few lines down already resolves
    // it via findWeekForTopic().
    const cleanTopic = window.RouteParams ? window.RouteParams.match([
      { pattern: /^\/task2-practice\/([^/?#]+)$/, param: 'topicId' }
    ]) : null;
    const urlTopicId = (cleanTopic && cleanTopic.topicId) || params.get('topicId');
    // Old share links / homework links carry ?mode=vocab|exam from when the
    // topic screen had a mode picker — now they just scroll to that step.
    const urlMode    = params.get('mode');
    if (urlMode === 'vocab' || urlMode === 'exam') _hubFocus = urlMode;

    const hasToken = window.AuthService.isLoggedIn();
    const [data, allDraftsData] = await Promise.all([
      apiFetch('/api/task2/weeks'),
      hasToken ? apiFetch('/api/task2/drafts').catch(() => ({ drafts: [] })) : Promise.resolve({ drafts: [] })
    ]);
    state.weeks = data.weeks || [];
    state.allDrafts = allDraftsData.drafts || [];

    // Scans every week's topic list to find which one currently owns
    // `topicId`. Used both when a deep link has no ?week= at all (older
    // homework assignments, before the week was snapshotted into
    // resourceCode) and when the ?week= it does have is stale — a homework
    // link snapshots the topic's week at assign time (resourceCompletionService
    // task2 catalog's deepLinkKey), and an admin can later move that topic
    // into a different week, leaving the link pointing nowhere.
    async function findWeekForTopic(topicId) {
      try {
        const perWeek = await Promise.all(
          state.weeks.map(w => apiFetch(`/api/task2/topics/week/${w.week}`).then(td => ({ week: w.week, topics: td.topics || [] })).catch(() => null))
        );
        return perWeek.find(x => x && x.topics.some(t => t._id === topicId)) || null;
      } catch { return null; }
    }

    if (urlTopicId && !urlWeek) {
      const hit = await findWeekForTopic(urlTopicId);
      if (hit) urlWeek = hit.week;
    }

    if (urlWeek && urlTopicId) {
      state.selectedWeek = urlWeek;
      const td = await apiFetch(`/api/task2/topics/week/${urlWeek}`);
      state.topics = td.topics || [];
      let topic = state.topics.find(t => t._id === urlTopicId);
      if (!topic) {
        const hit = await findWeekForTopic(urlTopicId);
        if (hit) { urlWeek = hit.week; state.selectedWeek = urlWeek; state.topics = hit.topics; topic = hit.topics.find(t => t._id === urlTopicId); }
      }
      if (topic) {
        state.selectedTopic = topic;
        state.topicStats = null;
        _resetHubState(topic._id);
        if (hasToken) {
          try {
            const [wrongData, draftData, , vocab] = await Promise.all([
              apiFetch(`/api/task2/wrong-questions/${urlTopicId}`),
              apiFetch(`/api/task2/draft/${urlTopicId}`),
              loadTopicStats(urlTopicId),
              _fetchVocab(urlTopicId)
            ]);
            state.wrongQuestionIds = wrongData.wrongIds || [];
            state.draft = draftData.draft || null;
            _applyVocab(urlTopicId, vocab);
          } catch {}
        }
        state.view = 'select';
        history.replaceState({ view: 'select', week: urlWeek, topicId: urlTopicId }, '', location.href);
        render();
        return;
      }
    } else if (urlWeek) {
      state.selectedWeek = urlWeek;
      const td = await apiFetch(`/api/task2/topics/week/${urlWeek}`);
      state.topics = td.topics || [];
      state.view = 'topics';
      history.replaceState({ view: 'topics', week: urlWeek }, '', location.href);
      render();
      return;
    }

    state.view = 'weeks';
    history.replaceState({ view: 'weeks' }, '', location.href);
    render();
  } catch { app.innerHTML = '<p style="text-align:center;color:red;padding:40px">Lỗi tải dữ liệu</p>'; }
}

// Drafts that still have unanswered questions — drives the "Đang làm dở"

function _pendingDrafts() {
  return (state.allDrafts || [])
    .map(d => ({ ...d, _rem: (d.questionIds?.length || 0) - (d.currentIdx || 0) }))
    .filter(d => d._rem > 0);
}

      <div style="font-size:22px">⭐</div>

        <div style="font-size:12px;color:var(--text2,#555)">Toàn bộ 18 tuần Task 2 Writing theo chủ đề</div>
      </div>
      <button onclick="openUpgradeModal()" style="background:linear-gradient(135deg,var(--brand,#e53935),var(--brand-dark,#c62828));color:#fff;border:none;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">Upgrade Premium</button>

          <button class="t2-primary is-sm t2-continue-go" data-week="${Number(d.week)}" data-topic="${_escHtml(String(d.topicId))}"><i class="fas fa-play"></i> Tiếp tục</button>
        </div>`).join('')}

    <div class="t2-group-grid">
      ${WEEK_GROUPS.map(g => `
        <div class="t2-group${g.essayType ? '' : ' is-review'}">
          <div class="t2-group-head">

                ? `<span class="${ESSAY_BADGE_CLASS[g.essayType]}">${ESSAY_LABELS[g.essayType]}</span>`
                : `<span class="et-badge t2-badge-mixed">Tổng hợp các dạng</span>`}

            ${g.weeks.map(w => {
              const d = weekData[w];

              return `<button type="button" class="t2-wk${d ? '' : ' locked'}${hasDraft ? ' has-draft' : ''}" data-week="${w}" ${d ? '' : 'disabled'}>
                <span class="t2-wk-num">Tuần ${w}</span>

                ${hasDraft ? `<span class="t2-week-draft-pill"><i class="fas fa-bookmark" style="font-size:9px"></i> Đang dở</span>` : ''}

function bindWeeks() {
  document.querySelectorAll('.t2-wk:not(.locked)').forEach(el => {

async function selectWeek(w) {
  state.selectedWeek = w;
  try {
    const data = await apiFetch(`/api/task2/topics/week/${w}`);
    state.topics = data.topics || [];
    state.view = 'topics';

    render();

// Jump straight from the weeks screen into one topic (the "Đang làm dở" box).
// With autoResume the saved draft is reopened right away — one click instead
// of week → topic → "Tiếp tục".
async function openTopicDirect(week, topicId, autoResume) {
  try {
    if (state.selectedWeek !== week || !state.topics.some(t => t._id === topicId)) {
      const data = await apiFetch(`/api/task2/topics/week/${week}`);
      state.topics = data.topics || [];
    }
    state.selectedWeek = week;
    if (!state.topics.some(t => t._id === topicId)) { showToast('Không tìm thấy chủ đề này nữa', 'warn'); return; }
    await selectTopic(topicId);
    if (autoResume && state.view === 'select' && state.selectedTopic?._id === topicId && state.draft) await resumeSession();
  } catch { showToast('Lỗi tải chủ đề', 'error'); }
}

// Where the student is on each topic's 3-step path, from what this browser
// already knows (no extra requests): vocab saved / best practice score /
// essay unlocked.
function _topicChips(t) {
  const id = t._id;
  const chips = [];
  if (isVocabLearned(id)) {
    chips.push('<span class="t2-step-chip ok"><i class="fas fa-check"></i> Từ vựng</span>');
  } else {
    const total = _vocabTotalMap[id];
    const saved = Math.min(_savedTermsForTopic(id).size, total || 0);
    chips.push(`<span class="t2-step-chip">📖 Từ vựng${total ? ` ${saved}/${total}` : ''}</span>`);
  }
  const best = _bestPracticeScore(id);
  if (best == null) chips.push('<span class="t2-step-chip">✏️ Chưa luyện</span>');
  else chips.push(`<span class="t2-step-chip ${best >= T2_WRITE_MIN_ACCURACY ? 'ok' : 'mid'}">✏️ Luyện câu ${best}%</span>`);
  if (t.writingTask2Id) {
    chips.push(best != null && best >= T2_WRITE_MIN_ACCURACY
      ? '<span class="t2-step-chip ok"><i class="fas fa-pen-nib"></i> Viết bài</span>'
      : '<span class="t2-step-chip"><i class="fas fa-lock"></i> Viết bài</span>');
  }
  return chips.join('');
}

        return `

              ${hasDraft ? `<span class="t2-week-draft-pill"><i class="fas fa-bookmark" style="font-size:9px"></i> Đang dở</span>` : ''}
            </div>

      }).join('') : '<p class="t2-page-sub" style="text-align:center;padding:24px">Tuần này chưa có chủ đề.</p>'}
    </div>`;
}
function bindTopics() {
  document.querySelectorAll('.t2-topic-card').forEach(el => {
    el.addEventListener('click', () => {
      // Topic data takes 4 requests — show it's working instead of a dead click.
      const ic = el.querySelector('.t2-topic-chev');
      if (ic) ic.className = 'fas fa-spinner fa-spin t2-topic-chev';
      selectTopic(el.dataset.id);
    });
  });
}
// Loads this user's practice record for `id` into state.topicStats, tagged
// with `forTopic` so a later render for a different topic can't read it by
// mistake. Best-effort — on any failure leaves a "not practised" shape so
// the gate simply falls back to the local _topicScores value.
async function loadTopicStats(id) {
  if (!(window.AuthService && window.AuthService.isLoggedIn())) {
    state.topicStats = { forTopic: id, practiced: false, bestScore: 0 };
    return;
  }
  try {
    const d = await apiFetch(`/api/task2/topic-stats/${id}`);
    state.topicStats = { forTopic: id, ...(d.stats || { practiced: false, bestScore: 0 }) };
  } catch {
    state.topicStats = { forTopic: id, practiced: false, bestScore: 0 };
  }
}

// ── Topic vocab (loaded inline on the hub) ──────────────────────────────
// Never rejects: null = fetch failed, so callers can Promise.all it.
async function _fetchVocab(id) {
  try {
    const d = await apiFetch(`/api/task2/vocabulary/${id}`);
    return d.vocabularyList || [];
  } catch { return null; }
}
function _applyVocab(id, list) {
  if (list == null) { state.vocabError = true; return; }
  state.vocabError = false;
  state.vocabFor = id;
  state.vocab = list;
  // Cache the total so the Luyện câu gate (isVocabLearned) and the topic
  // list chips work without refetching. Unique term COUNT, not list.length —
  // isVocabLearned compares this against _savedTermsForTopic(...).size, a Set
  // keyed by term that can never exceed the number of distinct terms; a
  // duplicated term in the list would otherwise keep the gate shut forever.
  _vocabTotalMap[id] = new Set(list.map(v => v.term)).size;
  localStorage.setItem(VOCAB_TOTAL_KEY, JSON.stringify(_vocabTotalMap));
}
let _vocabLoadingFor = null;
async function _ensureVocab(id) {
  if (!id || state.vocabFor === id || _vocabLoadingFor === id) return;
  _vocabLoadingFor = id;
  const list = await _fetchVocab(id);
  _vocabLoadingFor = null;
  if (state.selectedTopic?._id !== id) return;
  _applyVocab(id, list);
  if (state.view === 'select') render();
}
function retryVocab() {
  state.vocabError = false;
  _refreshVocabStep();
  _ensureVocab(state.selectedTopic?._id);
}
// Per-topic hub state that must not leak from one topic into the next.
function _resetHubState(id) {
  state.vocabQuiz = null;
  state.vocabOpen = null;
  if (state.vocabFor !== id) { state.vocab = []; state.vocabFor = null; state.vocabError = false; }
  if (state.brainstorm.topicId !== id) state.brainstorm = { topicId: id, notes: [], open: true, hintOpen: false };
}

let _selectTopicSeq = 0;
async function selectTopic(id) {
  if (window.AuthService && !window.AuthService.hasPremiumAccess()) {
    if (window.openUpgradeModal) window.openUpgradeModal();
    render(); // drop the card's loading spinner
    return;
  }
  const topic = state.topics.find(t => t._id === id);
  if (!topic) return;
  state.selectedTopic = topic;
  state.currentMode = 'practice';
  state.wrongQuestionIds = [];
  state.draft = null;
  state.topicStats = null;
  _resetHubState(id);
  const _p = new URLSearchParams({ week: state.selectedWeek, topicId: id });
  history.pushState({ view: 'select', week: state.selectedWeek, topicId: id }, '', `/task2-practice.html?${_p}`);
  // Guards against rapidly clicking between topics resolving out of order —
  // only the most recently-selected topic's wrong-questions/draft response
  // is allowed to apply, so a slow response for a topic the user already
  // clicked away from can't overwrite the newer topic's state.
  const requestId = ++_selectTopicSeq;
  if (window.AuthService.isLoggedIn()) {
    try {
      const [wrongData, draftData, , vocab] = await Promise.all([
        apiFetch(`/api/task2/wrong-questions/${id}`),
        apiFetch(`/api/task2/draft/${id}`),
        loadTopicStats(id),
        _fetchVocab(id)
      ]);
      if (requestId !== _selectTopicSeq) return;
      state.wrongQuestionIds = wrongData.wrongIds || [];
      state.draft = draftData.draft || null;
      _applyVocab(id, vocab);
    } catch {
      if (requestId !== _selectTopicSeq) return;
    }
  }
  state.view = 'select';
  render();
  window.scrollTo(0, 0);
}

// ════════════════════════════════════════════════════════
//  TOPIC HUB — one page, three steps:
//    ① Từ vựng   save the topic's words (quiz optional)  → unlocks ②
//    ② Luyện câu  sentence drills, best ≥ 70%              → unlocks ③
//    ③ Viết bài   full essay on writing.html
//  plus an optional week-wide "Thi thử". Replaces the old mode picker
//  (Luyện tập / Thi thử / Từ vựng tabs + a separate "Bắt đầu" button).
// ════════════════════════════════════════════════════════
let _hubFocus = null; // 'vocab' | 'exam' — scroll target after the next hub render

function _vocabStats(id) {
  const list = state.vocabFor === id ? state.vocab : [];
  const savedSet = _savedTermsForTopic(id);
  let total, saved = 0;
  if (list.length) {
    const terms = new Set(list.map(v => v.term));
    total = terms.size;
    terms.forEach(tm => { if (savedSet.has(tm)) saved++; });
  } else {
    total = _vocabTotalMap[id] || 0;
    saved = Math.min(savedSet.size, total);
  }
  return { total, saved, pct: total ? Math.round((saved / total) * 100) : 0 };
}

// "Brainstorm": right after reading the prompt the student writes their own
// ideas for each side, then reveals the suggested points to compare. Data:
// topic.brainstormHints (backend/scripts/data/task2Augment.js). Notes live in
// state.brainstorm only (never saved) so a hub re-render doesn't wipe them.
function _renderBrainstorm(t) {
  const hints = t.brainstormHints || [];
  if (!hints.length) return '';
  const bs = state.brainstorm;
  return `
    <details class="t2-brainstorm" ${bs.open ? 'open' : ''} ontoggle="state.brainstorm.open=this.open">
      <summary>💡 Brainstorm ý tưởng</summary>
      <div class="t2-brainstorm-sub">Đọc kỹ đề bên trên, tự viết 2–3 ý cho mỗi phần vào ô dưới. Nghĩ xong rồi mới mở gợi ý để so.</div>
      ${hints.map((h, i) => `
        <label class="t2-brainstorm-side">${_escHtml(h.side)}</label>
        <textarea class="t2-brainstorm-input" rows="2" placeholder="Ý của bạn cho phần này..." oninput="state.brainstorm.notes[${i}]=this.value">${_escHtml(bs.notes[i] || '')}</textarea>
      `).join('')}
      <details class="t2-brainstorm-reveal" ${bs.hintOpen ? 'open' : ''} ontoggle="state.brainstorm.hintOpen=this.open">
        <summary>Xem gợi ý ý chính</summary>
        ${hints.map(h => `
          <div class="t2-brainstorm-hint-side">${_escHtml(h.side)}</div>
          <ul class="t2-brainstorm-hint-list">${(h.points || []).map(p => `<li>${_escHtml(p)}</li>`).join('')}</ul>
        `).join('')}
      </details>
    </details>`;
}

function renderSelect() {
  const t = state.selectedTopic;

  return `
    <div class="t2-nav t2-nav-row">

        <div style="display:flex;gap:8px;flex-shrink:0">

        ${hasWrite ? stepItem('write', 3, 'Viết bài',

      </div>

      ${renderVocabStep(current === 'vocab')}

      ${hasWrite ? renderWriteStep(current === 'write') : ''}
      ${renderExamStep()}
    </div>`;
}

function renderVocabStep(isCurrent) {
  const id = state.selectedTopic._id;
  const done = isVocabLearned(id);
  const vs = _vocabStats(id);
  const loaded = state.vocabFor === id;
  const list = loaded ? state.vocab : [];
  const open = state.vocabOpen ?? !done;
  const loggedIn = window.AuthService && window.AuthService.isLoggedIn();
  let body;
  if (!loaded) {
    body = !loggedIn
      ? `<div class="t2-lock-note"><i class="fas fa-user-lock"></i> Đăng nhập để học từ vựng của chủ đề này.</div>`
      : state.vocabError
        ? `<div class="t2-lock-note"><i class="fas fa-exclamation-circle"></i> Không tải được từ vựng. <button class="t2-link" onclick="retryVocab()">Thử lại</button></div>`
        : `<p class="t2-step-desc"><i class="fas fa-spinner fa-spin"></i> Đang tải từ vựng...</p>`;
  } else if (!list.length) {
    body = `<p class="t2-step-desc">Chủ đề này chưa có danh sách từ vựng — bạn có thể sang bước Luyện câu luôn.</p>`;
  } else if (state.vocabQuiz) {
    body = renderVocabQuiz();
  } else {
    const savedSet = _savedTermsForTopic(id);
    const quizBest = _vquizBest[id];
    body = `
      <p class="t2-step-desc">${done
        ? 'Bạn đã lưu đủ từ vựng vào sổ. Làm quiz để ôn lại nếu muốn.'

      <div class="t2-meter${done ? ' ok' : ''}"><span style="width:${vs.pct}%"></span></div>
      <div class="t2-actions">

        <button class="t2-secondary" onclick="startVocabQuiz()" ${list.length < 4 ? 'disabled title="Cần ít nhất 4 từ"' : ''}><i class="fas fa-bolt"></i> Quiz từ vựng <span class="t2-opt-tag">tuỳ chọn</span></button>
        ${quizBest != null ? `<span class="t2-opt-tag" title="Kết quả quiz tốt nhất">Kỷ lục ${quizBest}%</span>` : ''}
        <button class="t2-link" onclick="toggleVocabList()" style="margin-left:auto">${open ? 'Thu gọn' : `Xem ${list.length} từ`} <i class="fas fa-chevron-${open ? 'up' : 'down'}"></i></button>
      </div>
      ${open ? `<div class="t2-vlist">
        ${list.map((v, i) => {
          const saved = savedSet.has(v.term);
          return `
          <div class="t2-vitem${saved ? ' is-saved' : ''}">
            <div class="t2-vitem-main">
              <div class="t2-vitem-term">${_escHtml(v.term)}<button class="t2-speak" onclick="speakVocab(${i})" title="Nghe phát âm" aria-label="Nghe phát âm"><i class="fas fa-volume-up"></i></button></div>
              ${v.definitionVi ? `<div class="t2-vitem-def">${_escHtml(v.definitionVi)}</div>` : ''}

        <div class="t2-step-title">Từ vựng</div>
        ${vs.total ? `<span class="t2-step-tag${done ? ' ok' : ''}">${vs.saved}/${vs.total} đã lưu</span>` : ''}
      </div>
      ${body}
    </section>`;
}

function renderPracticeStep(isCurrent) {

function scrollToHubStep(key) {

// Re-render just the vocab card (quiz clicks, list toggle) — keeps the rest
// of the hub (brainstorm textareas, scroll position) untouched.
function _refreshVocabStep() {
  const el = document.getElementById('t2-step-vocab');
  if (!el || state.view !== 'select') return;
  el.outerHTML = renderVocabStep(el.classList.contains('is-current'));
}

function toggleVocabList() {
  const id = state.selectedTopic?._id;
  const open = state.vocabOpen ?? !isVocabLearned(id);
  state.vocabOpen = !open;
  _refreshVocabStep();
}

function backToHub() {
  state.currentMode = 'practice';
  state.view = 'select';
  render();
  window.scrollTo(0, 0);
}

// "Viết bài ngay" — hand the student straight into the full Task 2 essay
// practice flow (writing.html), for THIS topic's prompt. That page reuses
// its own AI grading / draft / history machinery via ?taskType=2&taskId=.
// Only shown when the topic has been linked to a WritingTask2
// (scripts/seedTask2TopicEssays.js).
function goWriteFullEssay() {
  const topic = state.selectedTopic;
  const id = topic?.writingTask2Id;
  if (!id) { showToast('Chủ đề này chưa có đề luyện viết bài đầy đủ.', 'error'); return; }

  const gate = canWriteFullEssay(topic._id);
  if (!gate.ok) {
    showToast('🔒 Chưa mở khoá "Viết bài ngay". ' + writeGateMessage(gate), 'warn', 8000);
    if (state.view === 'select') scrollToHubStep('practice');
    return;
  }
  window.location.href = `/writing.html?taskType=2&taskId=${encodeURIComponent(id)}`;
}
function setExamCount(n, btn) {
  state.examCount = n;
  if (btn && btn.parentElement) btn.parentElement.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
}
function toggleT2Pref(key, btn) {
  state[key] = !state[key];
  if (btn) btn.classList.toggle('on', state[key]);
  try { localStorage.setItem(T2_PREFS_KEY, JSON.stringify({ autoNext: state.autoNext, shuffleMode: state.shuffleMode })); } catch {}
}

// Disables `btn` with a spinner while `fn` runs. The button may be gone by
// the time fn resolves (render() swapped the DOM) — only restore it if not.
async function _withBusy(btn, fn) {
  if (btn && btn.disabled) return;
  const html = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang tải...'; }
  try { return await fn(); }
  finally { if (btn && btn.isConnected) { btn.disabled = false; btn.innerHTML = html; } }
}
