<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IELTS Task 2 Practice – EnglishWithDan</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link rel="stylesheet" href="/css/tokens.css?v=307c2602bb"/>
  <link rel="stylesheet" href="/css/components.css?v=d2125349c7"/>
  <link rel="stylesheet" href="/css/writing-practice.css?v=f34fe3721d"/>
  <link rel="stylesheet" href="/css/mobile.css?v=1319d3b9c8"/>
  <link rel="stylesheet" href="/css/dictionary-popup.css?v=dd9cf65aa3"/>
  <script src="/js/theme.js?v=81e03964c4"></script>
  <script src="/js/shared/site-guard.js?v=c04e9f321f" defer></script>
  <script src="/js/shared/visit-tracker.js?v=c9376aa47f" defer></script>
  <link rel="stylesheet" href="/css/task2-practice.css?v=de5b5f07a7">
  <link rel="stylesheet" href="/css/playful.css?v=ffb392e664"/>
</head>
<body>
<script src="/js/bundles/app-shell.js?v=cb09d431e1"></script>
<script src="/js/shared/onboarding-tour.js?v=bba31307cf"></script>
<script src="/js/shared/review-required-popup.js?v=3c690f3016"></script>
<script src="/js/shared/writing-rewrite-reminder.js?v=2c99b4056c"></script>
<script src="/js/shared/route-params.js?v=9269bcbbb4"></script>
<script src="/js/shared/word-audio.js?v=28a7a7408e"></script>
<script src="/js/shared/dictionary-lookup.js?v=6fa492e2af"></script>
<script src="/js/shared/score-message.js?v=1823f4c22c"></script>


<!-- ── Quit modal ── -->
<div class="t2-quit-overlay hidden" id="t2-quit-overlay">
  <div class="t2-quit-box">
    <div class="t2-quit-top">
      <div class="t2-quit-mascot" id="t2-quit-mascot">✏️</div>
      <div class="t2-quit-title" id="t2-quit-title">Dừng luyện tập?</div>
      <div class="t2-quit-sub"   id="t2-quit-sub"></div>
    </div>
    <div class="t2-quit-actions">
      <button class="t2-quit-continue" id="t2-quit-continue-btn"><i class="fas fa-arrow-left"></i> Tiếp tục học</button>
      <button class="t2-quit-save hidden" id="t2-quit-save-btn"><i class="fas fa-bookmark"></i> Thoát và lưu tiến độ</button>
      <button class="t2-quit-leave"    id="t2-quit-leave-btn">Dừng lại</button>
    </div>
  </div>
</div>

<!-- ── Mini stats widget (XP/streak/sound) — floats top-right, shared
     global nav (js/nav.js) now handles page navigation for this page ── -->
<div class="wp-mini-stats">
  <div class="wp-xp-badge"><i class="fas fa-star"></i> <span id="header-xp">0</span> XP</div>
  <div class="wp-streak-badge">🔥 <span id="header-streak">0</span></div>
</div>

<!-- Desktop stats widget -->
<div class="wp-stats-widget" id="t2-stats-widget" style="display:none">
  <div class="wp-stats-widget-title"><i class="fas fa-chart-bar"></i> Phiên học</div>
  <div class="wp-stats-row">
    <div class="wp-stat-box">
      <div class="wp-stat-num" id="widget-done">0</div>
      <div class="wp-stat-label">Bài làm</div>
    </div>
    <div class="wp-stat-box">
      <div class="wp-stat-num" id="widget-xp">0</div>
      <div class="wp-stat-label">XP</div>
    </div>
    <div class="wp-stat-box">
      <div class="wp-stat-num" id="widget-correct">–</div>
      <div class="wp-stat-label">Đúng</div>
    </div>
  </div>
</div>

<!-- ── Mobile stats bar ── -->
<div class="wp-mobile-stats" id="wp-mobile-stats">
  <div class="wp-mob-stat">
    <div class="wp-mob-stat-num" id="mob-stat-done">0</div>
    <div class="wp-mob-stat-lbl">Bài làm</div>
  </div>
  <div class="wp-mob-stat">
    <div class="wp-mob-stat-num" id="mob-stat-xp">0</div>
    <div class="wp-mob-stat-lbl">XP</div>
  </div>
  <div class="wp-mob-stat">
    <div class="wp-mob-stat-num" id="mob-stat-correct">–</div>
    <div class="wp-mob-stat-lbl">Đúng</div>
  </div>
</div>

<!-- ── MAIN CONTENT ── -->
<div id="app" style="max-width:900px;margin:0 auto;padding-bottom:40px"></div>

<!-- Dictionary lookup (double-click a word) -->
<div id="dict-popup" class="dict-popup hidden">
  <div class="dict-header">
    <span class="dict-word" id="dict-word"></span>
    <span class="dict-phonetic" id="dict-phonetic"></span>
    <button class="dict-speak" onclick="speakDictWord()" title="Nghe phát âm"><i class="fas fa-volume-up"></i></button>
    <button class="dict-close" onclick="closeDictPopup()"><i class="fas fa-times"></i></button>
  </div>
  <div id="dict-body" class="dict-body"></div>
</div>

<div id="dict-vocab-modal" class="dict-vocab-modal hidden">
  <div class="dict-vocab-box">
    <div class="dict-vocab-header">
      <h3>📚 Lưu vào sổ từ vựng</h3>
      <button class="dict-vocab-close" onclick="closeVocabPickerModal()"><i class="fas fa-times"></i></button>
    </div>
    <div class="dict-vocab-body">
      <div id="dict-vocab-book-list"></div>
      <div class="rd-vocab-new-section">
        <div class="rd-vocab-new-label">Hoặc tạo sổ mới:</div>
        <div style="display:flex;gap:8px">
          <input id="dict-new-book-name" type="text" placeholder="Tên sổ mới..." maxlength="40"
            class="rd-vocab-input"
            onkeydown="if(event.key==='Enter') createDictBookAndSave()" />
          <button onclick="createDictBookAndSave()" class="rd-vocab-create-btn">+ Tạo &amp; lưu</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/task2-practice.js?v=e5a22a3a35"></script>
</body>
</html>
